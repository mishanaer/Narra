<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Narra · Product analytics</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <style>
    :root{
      color-scheme:light;
      --ink:#111111;--ink-70:#111111b3;--ink-50:#11111180;--ink-20:#11111133;
      --ink-10:#1111111a;--ink-5:#1111110d;--paper:#f5f5f5;--card:#fff;
      --green:#46dc66;--blue:#0088ff;--orange:#ff8d28;--red:#ff383c;--yellow:#ffcc00;
      --radius:20px;--radius-small:12px;--shadow:0 1px 1px #1111110a,0 8px 24px #11111108;
    }
    *{box-sizing:border-box}
    html{background:var(--paper)}
    body{margin:0;background:var(--paper);color:var(--ink);font:16px/20px "SB Sans Interface",system-ui,sans-serif}
    button{font:inherit}
    main{width:min(1320px,calc(100% - 32px));margin:auto;padding:28px 0 64px}
    .top{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:24px}
    .brand{display:flex;align-items:center;gap:14px}.brand img{width:48px;height:48px}
    .eyebrow{color:var(--ink-50);font-family:"SB Sans Interface Caps",system-ui,sans-serif;font-size:11px;line-height:13px;text-transform:uppercase;letter-spacing:.08em}
    h1{font-size:32px;line-height:32px;letter-spacing:-.01em;margin:4px 0 0}
    h2{font-size:20px;line-height:24px;letter-spacing:-.01em;margin:0}
    h3{font-size:16px;line-height:20px;margin:0}
    .period{display:flex;background:var(--ink-5);border-radius:14px;padding:4px;position:sticky;top:12px;z-index:5;backdrop-filter:blur(12px)}
    .period button{appearance:none;border:0;background:transparent;border-radius:10px;padding:9px 13px;color:var(--ink-50);font-size:13px;font-weight:700;cursor:pointer}
    .period button:hover{color:var(--ink)}.period button.active{background:var(--ink);color:#fff}.period button:focus-visible{outline:3px solid #0088ff55;outline-offset:2px}
    .loading-note{font-size:13px;color:var(--ink-50);min-height:18px;margin:-12px 0 12px;text-align:right}
    .grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
    .metric-card,.panel{background:var(--card);border:1px solid var(--ink-10);border-radius:var(--radius);box-shadow:var(--shadow)}
    .metric-card{padding:18px;min-width:0}.metric-card .label,.mini .label{display:flex;align-items:center;gap:5px;color:var(--ink-50);font-size:13px;line-height:18px}
    .metric-card .value{font-size:32px;line-height:32px;font-weight:700;letter-spacing:-.01em;margin:9px 0 7px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
    .note,.sub{color:var(--ink-50);font-size:13px;line-height:18px}.metric-help{cursor:help;text-decoration:underline dotted;text-underline-offset:3px}.help-mark{display:inline-grid;place-items:center;width:15px;height:15px;border:1px solid var(--ink-20);border-radius:50%;font-size:10px;font-weight:800;text-decoration:none;color:var(--ink-50)}
    .panel{padding:22px;min-width:0}.section{margin-top:12px}.section-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:18px}.section-head .sub{margin-top:4px;max-width:780px}
    .layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(340px,.75fr);gap:12px;margin-top:12px}
    .layout.equal{grid-template-columns:1fr 1fr}
    .kpi-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
    .coverage-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .mini{background:var(--paper);border-radius:var(--radius-small);padding:14px;min-width:0}
    .mini b{display:block;font-size:24px;line-height:28px;letter-spacing:-.01em;margin:5px 0 4px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
    .callout{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:13px 14px;border-radius:var(--radius-small);background:#fff8df;color:#654c00;font-size:13px;line-height:18px}.callout:before{content:'i';display:grid;place-items:center;width:20px;height:20px;background:var(--yellow);border-radius:50%;font-size:12px;font-weight:800;color:var(--ink)}
    .chart-card{min-width:0}.chart-title{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:2px}.unit{color:var(--ink-50);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
    .plot-shell{display:grid;grid-template-columns:42px minmax(0,1fr);gap:8px;margin-top:18px}.y-axis{height:244px;position:relative;color:var(--ink-50);font-size:11px;font-variant-numeric:tabular-nums}.y-axis span{position:absolute;right:0;transform:translateY(50%)}
    .plot-area{height:244px;position:relative;border-bottom:1px solid var(--ink-20);min-width:0}.grid-line{position:absolute;left:0;right:0;border-top:1px solid var(--ink-10)}
    .bar-groups{position:absolute;inset:0;display:flex;align-items:stretch;gap:4px}.bar-group{flex:1;display:flex;justify-content:center;align-items:flex-end;gap:4px;position:relative;min-width:18px;padding:0 2px}.bar-wrap{height:100%;width:min(22px,42%);position:relative;display:flex;align-items:flex-end;justify-content:center}.bar{width:100%;min-height:2px;border:1px solid #11111122;border-bottom:0;border-radius:7px 7px 0 0;background:var(--green)}.bar-value{position:absolute;white-space:nowrap;transform:translateY(50%);font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}.x-label{position:absolute;left:50%;bottom:-25px;transform:translateX(-50%);color:var(--ink-50);font-size:11px;white-space:nowrap}.legend{display:flex;flex-wrap:wrap;gap:14px;margin:32px 0 0 50px;color:var(--ink-50);font-size:12px}.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:0}
    .exact{margin:14px 0 0 50px}.exact summary,details.panel>summary{cursor:pointer;color:var(--ink-50);font-size:13px}.exact table{margin-top:8px}
    .rows{display:grid;gap:16px}.feature-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center}.feature-name{font-weight:700}.feature-count{display:block;color:var(--ink-50);font-size:12px;margin-top:2px}.feature-value{text-align:right;font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}.track{height:8px;background:var(--ink-10);border-radius:8px;overflow:hidden;margin-top:7px}.fill{height:100%;background:var(--green);border-radius:8px}
    .funnel-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;padding:12px 0;border-bottom:1px solid var(--ink-10)}.funnel-row:last-child{border-bottom:0}.funnel-row b{font-variant-numeric:tabular-nums}
    .tables{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.table-card{border:1px solid var(--ink-10);border-radius:var(--radius-small);overflow-x:auto;min-width:0}.table-card h3{padding:13px 14px;background:var(--paper)}
    .provider-tables{grid-template-columns:1fr}
    .table-scroll{overflow-x:auto}.three-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
    table{width:100%;border-collapse:collapse;font-size:12px;line-height:16px}th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--ink-10);vertical-align:top}tr:last-child td{border-bottom:0}th{color:var(--ink-50);font-size:10px;line-height:13px;text-transform:uppercase;letter-spacing:.04em}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}.clip{max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .benchmark-row{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin:0 0 12px}.benchmark{background:var(--paper);border-radius:var(--radius-small);padding:12px;min-width:0}.benchmark span{display:block;color:var(--ink-50);font-size:11px;line-height:14px}.benchmark b{display:block;margin-top:5px;font-size:18px;line-height:22px;font-variant-numeric:tabular-nums}.action-note,.focus-note{padding:12px 14px;border-radius:var(--radius-small);font-size:13px;line-height:18px;margin-bottom:10px}.action-note{background:#eaf5ff;color:#004f8d}.focus-note{background:#fff8df;color:#654c00;overflow-wrap:anywhere}.request-ref{appearance:none;border:0;background:transparent;color:var(--ink);font:inherit;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;padding:0;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}.request-ref:hover{color:#006bc9}.request-ref:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:3px}
    .monitor-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.monitor{padding:16px;border:1px solid var(--ink-10);border-radius:var(--radius-small);min-width:0}.monitor-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.monitor-state{border-radius:999px;padding:4px 9px;font-size:10px;font-weight:800;text-transform:uppercase}.monitor-state.up{background:#e8fbe8;color:#17652b}.monitor-state.standby{background:#eaf5ff;color:#005ca9}.monitor-state.degraded{background:#fff1c2;color:#6e5100}.monitor-state.down{background:#ffe3e3;color:#a01c1c}.monitor-state.unknown{background:var(--ink-10);color:var(--ink-50)}.monitor-url{display:block;color:#006bc9;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:9px}.monitor-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.monitor-facts span{font-size:11px;color:var(--ink-50)}.monitor-facts b{display:block;color:var(--ink);font-size:15px;margin-top:2px}.monitor-explanation{margin-top:12px;padding-top:10px;border-top:1px solid var(--ink-10);font-size:12px;line-height:16px;color:var(--ink-70)}
    details.panel{padding:0}details.panel>summary{list-style:none;padding:20px 22px;font-weight:700;color:var(--ink);font-size:16px}details.panel>summary::-webkit-details-marker{display:none}details.panel>summary:after{content:'+';float:right;color:var(--ink-50)}details[open].panel>summary:after{content:'−'}details.panel>.inside{padding:0 22px 22px}
    .tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.tool{padding:15px;border:1px solid var(--ink-10);border-radius:var(--radius-small);background:var(--paper);min-width:0}.tool.selected{border:2px solid var(--blue);padding:14px;background:#f0f8ff}.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:#dff1ff;color:#00599e;font-size:9px;font-weight:800;text-transform:uppercase}.tool b{display:block;font-size:24px;line-height:28px;margin:8px 0 4px}
    .diagnostics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.warning,.ok{padding:11px 13px;border-radius:var(--radius-small);margin-top:8px;font-size:13px}.warning{background:#fff1c2;color:#654c00}.ok{background:#e8fbe8;color:#17652b}.footer{display:flex;justify-content:space-between;gap:16px;color:var(--ink-50);font-size:12px;margin-top:14px}
    .skeleton-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.skeleton{height:132px;border-radius:var(--radius);background:linear-gradient(90deg,#fff 0,#eeeeea 45%,#fff 90%);background-size:220% 100%;animation:pulse 1.25s ease-in-out infinite}.skeleton.wide{grid-column:span 3;height:310px}@keyframes pulse{to{background-position:-220% 0}}
    .error{padding:18px;border-radius:var(--radius-small);background:#ffe3e3;color:#8f1616}.error button{margin-top:10px;border:0;border-radius:10px;background:var(--ink);color:#fff;padding:8px 12px;cursor:pointer}
    @media(max-width:1050px){.grid,.skeleton-grid{grid-template-columns:repeat(3,1fr)}.kpi-row{grid-template-columns:repeat(2,1fr)}.tools{grid-template-columns:repeat(2,1fr)}.diagnostics{grid-template-columns:repeat(3,1fr)}.benchmark-row{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:780px){main{width:min(100% - 20px,1320px);padding-top:18px}.top{align-items:flex-start;flex-direction:column}.period{width:100%;position:static}.period button{flex:1}.layout,.layout.equal,.tables{grid-template-columns:1fr}.monitor-grid{grid-template-columns:1fr}.loading-note{text-align:left;margin-top:-4px}.grid{grid-template-columns:repeat(2,1fr)}.chart-scroll{overflow-x:auto;padding-bottom:4px}.plot-shell,.legend,.exact{min-width:560px}.legend,.exact{margin-left:50px}.diagnostics{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:480px){.grid,.three-grid,.skeleton-grid,.kpi-row,.tools,.diagnostics,.benchmark-row{grid-template-columns:1fr}.metric-card .value{font-size:28px}.panel{padding:18px}.monitor-facts{grid-template-columns:repeat(2,1fr)}.footer{flex-direction:column}}
    @media(prefers-reduced-motion:reduce){.skeleton{animation:none}}
  </style>
</head>
<body><main>
  <header class="top"><div class="brand"><img src="logo.svg" alt="Narra"><div><div class="eyebrow">Traction · Product analytics</div><h1>Narra reading health</h1></div></div><nav class="period" aria-label="Reporting period"><button data-days="1" class="active" aria-pressed="true">Today</button><button data-days="7" aria-pressed="false">7 dates</button><button data-days="30" aria-pressed="false">30 dates</button></nav></header>
  <div id="loading-note" class="loading-note" aria-live="polite"></div>
  <div id="app" aria-busy="true"><div class="skeleton-grid" aria-label="Loading analytics"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton wide"></div><div class="skeleton wide"></div></div></div>
</main><script>
const app=document.getElementById('app');const loadingNote=document.getElementById('loading-note');let days=1;const memory=new Map();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>v===null||v===undefined?'—':typeof v==='number'?new Intl.NumberFormat('en',{maximumFractionDigits:2}).format(v):esc(v);
const compact=v=>{if(v===null||v===undefined)return'—';const n=Number(v);return Math.abs(n)<1000?fmt(n):new Intl.NumberFormat('en',{notation:'compact',maximumFractionDigits:2}).format(n)};
const pct=v=>v===null||v===undefined?'—':`${fmt(v)}%`;
const ms=v=>v===null||v===undefined?'—':Number(v)>=1000?`${fmt(Number(v)/1000)} s`:`${fmt(v)} ms`;
const money=(v,c='USD')=>v===null||v===undefined?'—':new Intl.NumberFormat('en',{style:'currency',currency:c,maximumFractionDigits:6}).format(v);
const duration=v=>{if(v===null||v===undefined)return'—';const seconds=Math.max(0,Number(v));if(seconds<60)return`${fmt(seconds)} s`;const minutes=Math.floor(seconds/60);const rest=Math.round(seconds%60);return rest?`${minutes} min ${rest} s`:`${minutes} min`};
const purposeName=v=>({structured_task:'Narra analysis',character_chat:'Character chat',summary:'Book summary',scenario:'Scene scenario',memory:'Memory'}[v]||v||'Unreported');
const diagnosticValue=x=>{const one=value=>x.unit==='seconds'||x.unit==='seconds_pair'?duration(value):x.unit==='%'?pct(value):fmt(value);return`${one(x.value)}${x.secondary===undefined?'':` / ${one(x.secondary)}`}`};
const card=x=>`<article class="metric-card"${x.help?` title="${esc(x.help)}"`:''}><span class="label${x.help?' metric-help':''}">${esc(x.label)}${x.help?'<span class="help-mark" aria-hidden="true">i</span>':''}</span><div class="value">${x.display??fmt(x.value)}</div><div class="note">${esc(x.note||'')}</div></article>`;
function niceMax(value){if(value<=1)return 1;const power=10**Math.floor(Math.log10(value));const normalized=value/power;const step=normalized<=2?2:normalized<=5?5:10;return step*power}
function chart(rows,fields,unit){if(!rows.length)return'<div class="note">No observed dates in this window</div>';const ceiling=niceMax(Math.max(1,...rows.flatMap(row=>fields.map(field=>Number(row[field.key]||0)))));const ticks=[0,.25,.5,.75,1];const y=ticks.map(t=>`<span style="bottom:${t*100}%">${compact(ceiling*t)}</span>`).join('');const grid=ticks.map(t=>`<i class="grid-line" style="bottom:${t*100}%"></i>`).join('');const groups=rows.map(row=>`<div class="bar-group">${fields.map(field=>{const value=Number(row[field.key]||0);const height=value/ceiling*100;return`<div class="bar-wrap" title="${esc(row.label)} · ${esc(field.label)}: ${fmt(value)} ${esc(unit)}"><span class="bar-value" style="bottom:calc(${height}% + 7px)">${fmt(value)}</span><i class="bar" style="height:${height}%;background:${field.color}"></i></div>`}).join('')}<span class="x-label">${esc(row.label)}</span></div>`).join('');const legend=fields.length>1?`<div class="legend">${fields.map(field=>`<span><i style="background:${field.color}"></i>${esc(field.label)}</span>`).join('')}</div>`:'';const table=`<details class="exact"><summary>Exact values · ${rows.length} observed ${rows.length===1?'date':'dates'}</summary><table><thead><tr><th>Date</th>${fields.map(field=>`<th class="num">${esc(field.label)} · ${esc(unit)}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr><td>${esc(row.label)}</td>${fields.map(field=>`<td class="num">${fmt(row[field.key])}</td>`).join('')}</tr>`).join('')}</tbody></table></details>`;return`<div class="chart-scroll"><div class="plot-shell"><div class="y-axis" aria-hidden="true">${y}</div><div class="plot-area">${grid}<div class="bar-groups">${groups}</div></div></div>${legend}${table}</div>`}
const tableRows=rows=>rows.length?rows.map(x=>`<tr><td class="clip" title="${esc(x.name)}">${esc(x.name)}</td><td class="num">${fmt(x.attempts)}</td><td class="num">${pct(x.success_rate)}</td></tr>`).join(''):'<tr><td colspan="3">No attempts in this window</td></tr>';
function monitorExplanation(x){if(x.error_code==='UPSTREAM_DEGRADED')return'Readiness passed, but the service reported a non-blocking dependency warning.';if(x.state==='down')return'The latest probe failed. Check the endpoint and recent availability before treating product metrics as complete.';if(x.state==='standby')return'This endpoint is intentionally parked and is not counted as downtime.';if(x.state==='up')return'The latest probe passed.';return'No fresh probe result is available yet.'}
function render(d,meta={}){
  const product=d.product_kpis||{};const audience=d.audience||{};const periodName=days===1?'today · Moscow time':`${days} Moscow dates`;const tokenNote=`Average split: ${compact(d.ai.input_tokens_per_request)} input + ${compact(d.ai.output_tokens_per_request)} output · ${fmt(d.ai.token_sample_size)} requests measured`;
  const primary=d.primary.map(card).join('');
  const audienceCards=[
    {label:'Client telemetry coverage',value:audience.client_telemetry_coverage,display:pct(audience.client_telemetry_coverage),note:`${fmt(audience.client_observed_users)} of ${fmt(audience.known_users)} known users sent app-open events`,help:'Older clients can appear through server-side AI requests before they send lifecycle events.'},
    {label:'Observed book openers',value:audience.book_openers,display:fmt(audience.book_openers),note:`${pct(audience.book_open_rate)} of known users; provisional while client coverage is incomplete`},
  ].map(card).join('');
  const features=d.features.length?d.features.map(x=>`<div class="feature-row"><div><span class="feature-name">${esc(x.name)}</span><span class="feature-count">${fmt(x.users)} of ${fmt(x.active_users)} active users</span><div class="track" aria-hidden="true"><div class="fill" style="width:${Math.min(100,x.adoption)}%"></div></div></div><div class="feature-value">${pct(x.adoption)}</div></div>`).join(''):'<div class="note">No feature events in this window</div>';
  const funnels=d.funnels.map(x=>`<div class="funnel-row"><span><b>${esc(x.label)}</b><span class="feature-count">${fmt(x.completed)} completed of ${fmt(x.started)} started · ${esc(x.unit)}</span></span><b>${x.rate===null?'—':pct(x.rate)}</b></div>`).join('');
  const aiCards=[
    {label:'Logical AI requests',value:d.ai.requests,note:`${fmt(d.ai.completed)} completed · ${fmt(d.ai.failed)} failed · ${fmt(d.ai.pending)} pending`,help:'One user-origin request counts once. Provider retries and fallback attempts remain inside that request.'},
    {label:'Request success',value:d.ai.success_rate,display:pct(d.ai.success_rate),note:`${fmt(d.ai.completed)} successful of ${fmt(d.ai.outcome_eligible)} outcome-eligible`,help:'Share of resolved or overdue logical requests that completed successfully after the outcome grace period.'},
    {label:'Latency · average / median / p95',value:d.ai.latency_average_ms,display:`${ms(d.ai.latency_average_ms)} / ${ms(d.ai.latency_median_ms)} / ${ms(d.ai.latency_p95_ms)}`,note:`${fmt(d.ai.latency_sample_size)} completed requests measured · p99 ${ms(d.ai.latency_p99_ms)}`,help:'Average estimates capacity impact. Median is the typical completed request. p95 is the speed that 95% of measured requests meet or beat.'},
    {label:`Slow requests · ≥${fmt(d.ai.slow_request_threshold_ms/1000)} s`,value:d.ai.slow_request_rate,display:pct(d.ai.slow_request_rate),note:`${fmt(d.ai.slow_requests)} of ${fmt(d.ai.latency_sample_size)} requests with latency`,help:'Tail-latency guardrail. Investigate the table below when this share or p95 rises.'},
    {label:'Provider attempts / request',value:d.ai.attempts_per_request,note:`${fmt(d.ai.fallback_requests)} fallback requests · ${pct(d.ai.fallback_rate)}`,help:'Technical load per user request. Values above 1 mean retries or fallback increased provider traffic.'},
    {label:'Tokens · average / median / p95',value:d.ai.tokens_per_request,display:`${compact(d.ai.tokens_per_request)} / ${compact(d.ai.tokens_median_per_request)} / ${compact(d.ai.tokens_p95_per_request)}`,note:tokenNote,help:'Average supports capacity planning. Median describes a typical measured request. p95 exposes unusually deep or expensive requests.'},
    {label:'Token consumption',value:d.ai.total_tokens,display:compact(d.ai.total_tokens),note:`${fmt(d.ai.total_tokens)} input + output in ${periodName} · ${pct(d.ai.token_coverage)} coverage`,help:'Total measured input and output tokens in the selected window. Use it for capacity and cost control, not product adoption.'},
    {label:`Known cost / request · ${d.ai.cost_currency}`,value:d.ai.known_cost_per_request,display:money(d.ai.known_cost_per_request,d.ai.cost_currency),note:`${money(d.ai.known_cost,d.ai.cost_currency)} total · ${pct(d.ai.cost_coverage)} coverage`,help:'Average exact provider-reported cost among requests with accepted cost metadata. It is not a complete total when coverage is below 100%.'},
  ].map(card).join('');
  const purposeRows=(d.ai.purposes||[]).length?d.ai.purposes.map(x=>`<tr><td>${esc(purposeName(x.name))}</td><td class="num">${fmt(x.actors)}</td><td class="num">${fmt(x.requests)}</td><td class="num">${fmt(x.completed)}</td><td class="num">${pct(x.success_rate)}</td></tr>`).join(''):'<tr><td colspan="5">No logical requests in this window</td></tr>';
  const slowest=d.ai.slowest||[];const dominant=(rows,key)=>{const counts=new Map();rows.forEach(x=>counts.set(key(x),(counts.get(key(x))||0)+1));return[...counts].sort((a,b)=>b[1]-a[1])[0]||[null,0]};const [focusPair,focusCount]=dominant(slowest,x=>`${x.purpose}\u0000${x.route}`);const [focusPurpose,focusRoute]=(focusPair||'\u0000').split('\u0000');
  const slowRows=slowest.length?slowest.map(x=>`<tr><td><button class="request-ref" data-copy-ref="${esc(x.request_ref)}" aria-label="Copy request suffix ${esc(x.request_ref)}">…${esc(x.request_ref)}</button></td><td>${esc(purposeName(x.purpose))}</td><td class="clip" title="${esc(x.route)}">${esc(x.route)}</td><td class="num">${ms(x.latency_ms)}</td><td class="num">${compact(x.input_tokens)}</td><td class="num">${compact(x.output_tokens)}</td><td class="num">${compact(x.tokens)}</td></tr>`).join(''):'<tr><td colspan="7">No completed requests with latency in this window</td></tr>';
  const focusNote=slowest.length?`${fmt(focusCount)} of ${fmt(slowest.length)} displayed slowest requests concentrate in ${purposeName(focusPurpose)} via ${focusRoute}. Start the investigation there.`:'No completed requests with latency are available for this window.';
  const dailyAi=d.series.length?d.series.map(x=>`<tr><td>${esc(x.label)}</td><td class="num">${fmt(x.ai_requests)}</td><td class="num">${pct(x.ai_success_rate)}</td><td class="num">${ms(x.ai_latency_p95_ms)}</td><td class="num" title="Exact daily input + output: ${fmt(x.ai_tokens)} tokens">${compact(x.ai_tokens)}</td></tr>`).join(''):'<tr><td colspan="5">No observed dates</td></tr>';
  const productCards=[
    {label:'Narra value · WAU',value:product.value_wau,note:'users who received a successful user-origin result this Moscow week'},
    {label:'7-day activation',value:product.activation_7d?.rate,display:pct(product.activation_7d?.rate),note:`${fmt(product.activation_7d?.activated)} of ${fmt(product.activation_7d?.eligible)} mature first-open cohorts`},
    {label:'D7+ value retention',value:product.value_retention_d7?.rate,display:pct(product.value_retention_d7?.rate),note:`${fmt(product.value_retention_d7?.retained)} of ${fmt(product.value_retention_d7?.eligible)} mature first-value cohorts`},
  ].map(card).join('');
  const retention=['d1','d7','d30'].map(key=>{const x=d.retention[key];return card({label:`Rolling ${key.toUpperCase()}+ retention`,value:x.rate,display:pct(x.rate),note:`${fmt(x.returned)} returned of ${fmt(x.eligible)} mature readers`,help:'Return on or after the horizon, anchored to the first qualified reading session.'})}).join('');
  const tools=d.tool_definitions.map(x=>`<article class="tool${x.selected_for_overview?' selected':''}" title="${esc(x.help)}">${x.selected_for_overview?'<span class="badge">Overview KPI</span>':''}<span class="label metric-help">${esc(x.label)}</span><b>${fmt(x.value)}</b><span class="note">${fmt(x.numerator)} ${esc(x.numerator_label)} ÷ ${fmt(x.denominator)} ${esc(x.denominator_label)}</span></article>`).join('');
  const diagnostics=d.diagnostics.map(x=>`<div class="mini" title="${esc(x.help)}"><span class="label metric-help">${esc(x.label)}</span><b>${diagnosticValue(x)}</b><span class="note">${esc(x.note)}</span></div>`).join('');
  const monitorState=x=>['up','standby','degraded','down'].includes(x)?x:'unknown';
  const monitors=d.monitoring.targets.map(x=>{const day=x.windows['24h']||{};return`<article class="monitor"><div class="monitor-head"><b>${esc(x.label)}</b><span class="monitor-state ${monitorState(x.state)}">${esc(x.state)}</span></div><a class="monitor-url" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.url)}</a><div class="monitor-facts"><span>HTTP status<b>${fmt(x.http_status)}</b></span><span>Latest latency<b>${ms(x.latency_ms)}</b></span><span>Availability · 24h<b>${day.availability==null?'—':pct(day.availability)}</b></span><span>Probe coverage · 24h<b>${day.coverage==null?'—':pct(day.coverage)}</b></span><span>Observed probes<b>${fmt(day.samples)} / ${fmt(day.expected_samples)}</b></span><span>TLS remaining<b>${x.tls_days_remaining==null?'—':fmt(x.tls_days_remaining)+' days'}</b></span></div><div class="monitor-explanation">${esc(monitorExplanation(x))}</div></article>`}).join('');
  const warnings=d.quality.warnings.length?d.quality.warnings.map(x=>`<div class="warning">${esc(x)}</div>`).join(''):'<div class="ok">No active data-quality warnings</div>';
  app.innerHTML=`
    <section class="grid" aria-label="Audience overview">${primary}</section>
    <section class="layout section"><article class="panel chart-card"><div class="section-head"><div><h2>Daily active users</h2><div class="sub">Distinct active pseudonymous users by Moscow date · vertical scale starts at zero</div></div><span class="unit">users</span></div>${chart(d.series,[{key:'active',label:'Active users',color:'var(--green)'}],'users')}</article><article class="panel"><div class="section-head"><div><h2>Audience coverage</h2><div class="sub">Why reading metrics can be lower than server-observed activity</div></div></div><div class="kpi-row coverage-grid">${audienceCards}</div><div class="callout" style="margin-top:12px">Server-side AI events already identify users on older clients. Book opening and reading events appear only after those clients receive the new telemetry build.</div></article></section>
    <section class="layout section"><article class="panel chart-card"><div class="section-head"><div><h2>Daily value activity</h2><div class="sub">Qualified product sessions and logical AI requests · retries excluded · scale starts at zero</div></div><span class="unit">actions</span></div>${chart(d.series,[{key:'sessions',label:'Qualified sessions',color:'var(--ink)'},{key:'tools',label:'AI requests',color:'var(--blue)'}],'actions')}</article><article class="panel"><div class="section-head"><div><h2>Feature adoption</h2><div class="sub">Users of each feature ÷ ${fmt(audience.active_users)} active users in the selected window</div></div></div><div class="rows">${features}</div></article></section>
    <section class="panel section"><div class="section-head"><div><h2>AI reliability and efficiency</h2><div class="sub">One user request counts once; provider retry and fallback remain technical attempts</div></div><span class="unit">selected window</span></div><div class="kpi-row">${aiCards}</div><div class="table-card" style="margin-top:12px"><h3>Daily AI health</h3><table><thead><tr><th>Date</th><th class="num">Requests</th><th class="num">Success</th><th class="num">Latency p95</th><th class="num">Tokens</th></tr></thead><tbody>${dailyAi}</tbody></table></div></section>
    <section class="panel section"><div class="section-head"><div><h2>Slow requests to investigate</h2><div class="sub">${fmt(slowest.length)} slowest of ${fmt(d.ai.latency_sample_size)} completed requests with latency · ${esc(periodName)} · sorted slowest first</div></div><span class="unit">diagnostic sample</span></div><div class="benchmark-row"><div class="benchmark"><span>Average latency</span><b>${ms(d.ai.latency_average_ms)}</b></div><div class="benchmark"><span>Median latency</span><b>${ms(d.ai.latency_median_ms)}</b></div><div class="benchmark"><span>p95 latency</span><b>${ms(d.ai.latency_p95_ms)}</b></div><div class="benchmark"><span>Slow share</span><b>${pct(d.ai.slow_request_rate)}</b></div><div class="benchmark"><span>Average tokens</span><b>${compact(d.ai.tokens_per_request)}</b></div><div class="benchmark"><span>Median tokens</span><b>${compact(d.ai.tokens_median_per_request)}</b></div></div><div class="action-note"><b>How to use this:</b> median describes a typical request; p95 shows the slow tail; average estimates total capacity pressure. When p95 or the slow share rises, copy a request suffix and search gateway logs, then compare repeated tasks and routes.</div><div class="focus-note">${esc(focusNote)} No prompt or response content is stored.</div><div class="table-scroll"><table><thead><tr><th>Request suffix</th><th>Task</th><th>Route</th><th class="num">Latency</th><th class="num">Input tokens</th><th class="num">Output tokens</th><th class="num">Total tokens</th></tr></thead><tbody>${slowRows}</tbody></table></div></section>
    <section class="panel section"><div class="section-head"><div><h2>Reliability by task</h2><div class="sub">Absolute user, request and completion counts make the percentage auditable</div></div></div><div class="table-scroll"><table><thead><tr><th>Task</th><th class="num">Users</th><th class="num">Requests</th><th class="num">Completed</th><th class="num">Success</th></tr></thead><tbody>${purposeRows}</tbody></table></div></section>
    <section class="layout equal section"><article class="panel"><div class="section-head"><div><h2>Product value</h2><div class="sub">Outcome, activation and repeat-value signals</div></div></div><div class="grid three-grid">${productCards}</div><div class="grid three-grid" style="margin-top:10px">${retention}</div></article><article class="panel"><div class="section-head"><div><h2>Product and update funnels</h2><div class="sub">Each row states its population and absolute stage counts</div></div></div>${funnels}</article></section>
    <section class="layout equal section"><article class="panel"><div class="section-head"><div><h2>Provider and model health</h2><div class="sub">Technical attempts, including retry and fallback</div></div></div><div class="tables provider-tables"><div class="table-card"><h3>Providers</h3><table><thead><tr><th>Provider</th><th class="num">Attempts</th><th class="num">Success</th></tr></thead><tbody>${tableRows(d.ai.providers)}</tbody></table></div><div class="table-card"><h3>Models</h3><table><thead><tr><th>Provider · model</th><th class="num">Attempts</th><th class="num">Success</th></tr></thead><tbody>${tableRows(d.ai.models)}</tbody></table></div></div></article><article class="panel"><div class="section-head"><div><h2>Reading engagement</h2><div class="sub">Observed client reading telemetry in the selected window</div></div></div><div class="kpi-row coverage-grid">${card({label:'Reading time',value:d.engagement.reading_minutes,display:`${fmt(d.engagement.reading_minutes)} min`,note:'sum of ended reading sessions'})}${card({label:'Qualified sessions',value:d.engagement.sessions,note:'reading ≥60 s or explicit user-origin tool session'})}</div></article></section>
    <details class="panel section" data-section="monitoring" open><summary>Domains and critical endpoints · ${esc(d.monitoring.overall)}</summary><div class="inside"><div class="sub">Fixed-target probes every minute. Availability and probe coverage are separate; a warning in staging does not mean production is down.</div><div class="monitor-grid">${monitors||'<div class="note">No monitor samples yet</div>'}</div></div></details>
    <details class="panel section" data-section="uptime" open><summary>External uptime · UptimeRobot</summary><div class="inside"><div class="sub">Independent out-of-process checks every 5 minutes from UptimeRobot. This stays observable even if the stats process itself is down.</div><div class="monitor-grid" id="uptime-grid"><div class="note">Loading external uptime…</div></div></div></details>
    <details class="panel section" data-section="diagnostics"><summary>Product and data diagnostics</summary><div class="inside"><div class="sub">Instrumentation, delivery and abnormal-depth checks; these are debugging signals, not headline product KPIs</div><div class="diagnostics">${diagnostics}</div></div></details>
    <details class="panel section" data-section="tools"><summary>Tools / DAU metric definitions</summary><div class="inside"><div class="sub">The blue card is the fleet Overview formula. Alternatives remain visible so a technical retry cannot silently become product usage.</div><div class="tools">${tools}</div></div></details>
    <details class="panel section" data-section="quality" open><summary>Data quality and metric coverage</summary><div class="inside"><div class="sub">Observed events only · collection starts ${esc(d.quality.data_start||'after the first event')} · available ${fmt(d.quality.available_days)} of ${fmt(d.quality.requested_days)} requested dates · session IDs ${pct(d.quality.session_id_coverage)} · request IDs ${pct(d.quality.request_id_coverage)} · outcomes ${pct(d.quality.outcome_coverage)} · tokens ${pct(d.quality.token_coverage)} · cost ${pct(d.quality.cost_coverage)}</div>${warnings}</div></details>
    <footer class="footer"><span>Privacy-safe observed events · no reconstructed legacy history</span><span>Updated ${esc(d.updated_at)}${meta.elapsed?` · loaded in ${fmt(meta.elapsed)} ms · server cache ${esc(meta.cache||'unknown')}`:''}</span></footer>`;
  app.setAttribute('aria-busy','false');bindDetails();bindCopyRefs();renderUptime();
}
let uptimeData=null;
const uptimeStateClass=s=>s===2?'up':(s===8||s===9)?'down':s===0?'standby':'unknown';
const uptimeStateText=s=>s===2?'up':(s===8||s===9)?'down':s===0?'paused':'pending';
function renderUptime(){const grid=document.getElementById('uptime-grid');if(!grid)return;
  if(!uptimeData){grid.innerHTML='<div class="note">Loading external uptime…</div>';return}
  if(uptimeData.configured===false){grid.innerHTML='<div class="note">UptimeRobot is not configured on this deployment (UPTIMEROBOT_API_KEY).</div>';return}
  const rows=(uptimeData.monitors||[]).map(m=>{const a=m.availability||{};const p=v=>v==null?'—':`${fmt(v)}%`;return`<article class="monitor"><div class="monitor-head"><b>${esc(m.name)}</b><span class="monitor-state ${uptimeStateClass(m.status)}">${esc(uptimeStateText(m.status))}</span></div><a class="monitor-url" href="${esc(m.url)}" target="_blank" rel="noopener noreferrer">${esc(m.url)}</a><div class="monitor-facts"><span>Availability · 24h<b>${p(a.d1)}</b></span><span>Availability · 7d<b>${p(a.d7)}</b></span><span>Availability · 30d<b>${p(a.d30)}</b></span></div></article>`}).join('');
  const staleNote=uptimeData.stale?'<div class="note">UptimeRobot is temporarily unreachable — showing the last successful fetch.</div>':'';
  const errorNote=uptimeData.error?'<div class="note">UptimeRobot is unreachable right now; external uptime will reappear automatically.</div>':'';
  grid.innerHTML=(rows||(errorNote?'':'<div class="note">No UptimeRobot monitors match the configured prefix.</div>'))+staleNote+errorNote}
async function loadUptime(){try{const r=await fetch('uptime',{cache:'no-store'});if(!r.ok)throw Error(`HTTP ${r.status}`);uptimeData=await r.json()}catch(e){uptimeData={configured:true,monitors:[],error:'unavailable'}}renderUptime()}
function bindCopyRefs(){document.querySelectorAll('[data-copy-ref]').forEach(button=>button.onclick=async()=>{const value=button.dataset.copyRef;try{await navigator.clipboard.writeText(value);const before=button.textContent;button.textContent='Copied';setTimeout(()=>button.textContent=before,1200)}catch{button.title=`Request suffix: ${value}`}})}
function bindDetails(){let saved={};try{saved=JSON.parse(localStorage.getItem('narra-dashboard-sections')||'{}')}catch{}document.querySelectorAll('details[data-section]').forEach(node=>{if(node.dataset.section in saved)node.open=!!saved[node.dataset.section];node.ontoggle=()=>{saved[node.dataset.section]=node.open;localStorage.setItem('narra-dashboard-sections',JSON.stringify(saved))}})}
async function load(){const cached=memory.get(days);if(cached)render(cached,{cache:'browser'});else app.setAttribute('aria-busy','true');loadingNote.textContent=cached?'Refreshing data…':'Loading analytics…';const started=performance.now();const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),8000);try{const r=await fetch(`dashboard?days=${days}`,{cache:'no-store',signal:controller.signal});if(!r.ok)throw Error(`HTTP ${r.status}`);const data=await r.json();memory.set(days,data);render(data,{elapsed:Math.round(performance.now()-started),cache:(r.headers.get('X-Narra-Stats-Cache')||'unknown').toLowerCase()});loadUptime();loadingNote.textContent=''}catch(e){if(!cached)app.innerHTML=`<div class="error"><b>Analytics did not load</b><br>${esc(e.name==='AbortError'?'The request exceeded 8 seconds':e.message)}<br><button id="retry">Retry</button></div>`;loadingNote.textContent='';document.getElementById('retry')?.addEventListener('click',load)}finally{clearTimeout(timer)}}
document.querySelectorAll('[data-days]').forEach(button=>button.onclick=()=>{days=Number(button.dataset.days);document.querySelectorAll('[data-days]').forEach(x=>{const active=x===button;x.classList.toggle('active',active);x.setAttribute('aria-pressed',String(active))});load()});load();
</script></body></html>
