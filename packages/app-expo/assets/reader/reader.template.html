      if (view && view.isFixedLayout) {
        applyFixedLayoutRendererSettings(renderer, currentPaginatedLayout);
      }

      if (settings.viewMode) {
        currentViewMode = settings.viewMode;
        applyRendererFlowMode(renderer);
      }
    }

    function getScrollNavigationDistance() {
      if (!view || !view.renderer) return Math.max(1, window.innerHeight - 96);
      const size = Number(view.renderer.size || 0);
      const fallbackSize = window.innerHeight || document.documentElement.clientHeight || 720;
      return Math.max(1, (Number.isFinite(size) && size > 0 ? size : fallbackSize) - 96);
    }

    async function goNextByMode(distance) {
      if (!view) return;
      if (view.renderer && view.renderer.scrolled) {
        await view.next(Math.max(1, Number(distance || getScrollNavigationDistance())));
      } else {
        await view.next();
      }
    }

    async function goPrevByMode(distance) {
      if (!view) return;
      if (view.renderer && view.renderer.scrolled) {
        await view.prev(Math.max(1, Number(distance || getScrollNavigationDistance())));
      } else {
        await view.prev();
      }
    }

    function splitCustomFontCSS(css) {
      const importUrls = [];
      const fontFaceLines = [];
      for (const line of (css || '').split('\n')) {
        const trimmed = line.trim();
        if (trimmed.startsWith('@import')) {
          const url = trimmed
            .replace(/^@import\s+url\(['"]?/, '')
            .replace(/['"]?\);?\s*$/, '')
            .trim();
          if (url) importUrls.push(url);
        } else {
          fontFaceLines.push(line);
        }
      }
      return {
        importUrls,
        fontFaceCSS: fontFaceLines.join('\n').trim(),
      };
    }

    function cssString(value) {
      return JSON.stringify(String(value || ''));
    }

    function syncCustomFontStylesForDoc(doc, css) {
      if (!doc || !doc.head) return;
      const { importUrls, fontFaceCSS } = splitCustomFontCSS(css);

      doc.querySelectorAll('link.__readany_css_font__').forEach((el) => el.remove());
      for (const url of importUrls) {
        const link = doc.createElement('link');
        link.rel = 'stylesheet';
        link.href = url;
        link.className = '__readany_css_font__';
        doc.head.appendChild(link);
      }

      const styleId = '__readany_custom_font_face__';
      let el = doc.getElementById(styleId);
      if (!el) {
        el = doc.createElement('style');
        el.id = styleId;
        doc.head.appendChild(el);
      }
      el.textContent = fontFaceCSS;
    }

    function syncCustomFontStylesForAllDocs(css) {
      for (const content of getRendererContents()) {
        if (!content || !content.doc) continue;
        syncCustomFontStylesForDoc(content.doc, css);
      }
    }

    function syncReaderOverrideStylesForDoc(doc, css) {
      if (!doc || !doc.head) return;
      const styleId = '__readany_reader_overrides__';
      let el = doc.getElementById(styleId);
      if (!el) {
        el = doc.createElement('style');
        el.id = styleId;
        doc.head.appendChild(el);
      }
      el.textContent = css || '';
      // Keep this style after book styles and our @font-face block so it wins
      // against EPUBs that define fixed font sizes with !important.
      doc.head.appendChild(el);
    }

    function syncReaderOverrideStylesForAllDocs(css) {
      for (const content of getRendererContents()) {
        if (!content || !content.doc) continue;
        syncReaderOverrideStylesForDoc(content.doc, css);
      }
    }

    function injectCustomFontFace(css) {
      syncCustomFontStylesForDoc(document, css);
      syncCustomFontStylesForAllDocs(css);
    }

    function isDarkCssColor(color) {
      const value = String(color || '').trim();
      let red;
      let green;
      let blue;

      if (/^#[0-9a-f]{3,8}$/i.test(value)) {
        const hex = value.slice(1);
        const normalized = hex.length === 3 || hex.length === 4
          ? hex.slice(0, 3).split('').map((part) => part + part).join('')
          : hex.slice(0, 6);
        red = parseInt(normalized.slice(0, 2), 16);
        green = parseInt(normalized.slice(2, 4), 16);
        blue = parseInt(normalized.slice(4, 6), 16);
      } else {
        const rgb = value.match(/^rgba?\(\s*([\d.]+)[,\s]+([\d.]+)[,\s]+([\d.]+)/i);
        if (!rgb) return false;
        red = Number(rgb[1]);
        green = Number(rgb[2]);
        blue = Number(rgb[3]);
      }

      return red * 0.2126 + green * 0.7152 + blue * 0.0722 < 128;
    }

    function setThemeColors(colors) {
      const bg = colors.background || '#1c1c1e';
      const fg = colors.foreground || '#e8e8ed';
      const muted = colors.muted || '#7c7c82';
      const primary = colors.primary || '#3b82f6';

      currentThemeColors = { bg, fg, muted, primary };

      document.documentElement.style.setProperty('--bg', bg);
      document.documentElement.style.setProperty('--fg', fg);
      document.documentElement.style.setProperty('--muted', muted);
      document.documentElement.style.setProperty('--primary', primary);
      document.documentElement.dataset.readerColorScheme = isDarkCssColor(bg) ? 'dark' : 'light';
      document.body.style.backgroundColor = bg;
      document.body.style.color = fg;

      if (view && view.renderer && view.renderer.setStyles) {
        const currentStyles = lastRendererStyles || '';
        const themedStyles = injectThemeIntoStyles(currentStyles, bg, fg, primary);
        view.renderer.setStyles(themedStyles);
        syncReaderOverrideStylesForAllDocs(themedStyles);
      }

      if (view && view.setSearchIndicator) {
        view.setSearchIndicator('highlight', { color: 'rgba(250, 204, 21, 0.4)' });
      }

      // Врезки сцен рисуются в цветах темы — обновить их стили в секциях
      try { sceneSlotSyncStyles(); } catch (e) {}
    }

    function injectThemeIntoStyles(baseStyles, bg, fg, primary) {
      const cleaned = baseStyles.replace(
        /\/\* __theme_colors__ \*\/[\s\S]*?\/\* __end_theme_colors__ \*\//g,
        '',
      );
      const themeBlock = `/* __theme_colors__ */
html, body {
  background-color: ${bg} !important;
  color: ${fg} !important;
}
/* Книга может красить свои контейнеры (обычно в белый) — тогда при смене темы
   вокруг текста остаются светлые поля. Гасим фон структурных блоков, чтобы
   проступал фон темы. Подсветки (mark, code, pre) намеренно не трогаем. */
body div, body section, body article, body main, body header, body footer,
body aside, body nav, body p, body blockquote, body li, body figure,
body table, body tbody, body thead, body tr, body td, body th {
  background-color: transparent !important;
}
p, div, span, blockquote, li, dd, dt, h1, h2, h3, h4, h5, h6, td, th, caption, figcaption, label, a {
  color: inherit !important;
}
a { color: ${primary} !important; }
::selection { background: rgba(59, 130, 246, 0.3) !important; }
/* __end_theme_colors__ */`;
      return themeBlock + '\n' + cleaned;
    }

    // ─── Document styles ───
    function normalizeBrOnlyParagraphs(doc) {
      if (!doc || doc.__readany_br_paragraphs_normalized) return;
      doc.__readany_br_paragraphs_normalized = true;

      const body = doc.body;
      if (!body || body.querySelectorAll('p').length > 2) return;

      const containers = Array.from(body.querySelectorAll('div, section, article, main'))
        .filter(shouldNormalizeBrParagraphContainer);
      if (shouldNormalizeBrParagraphContainer(body)) containers.push(body);

      for (const container of containers) {
        if (normalizeBrParagraphContainer(doc, container)) return;
      }
    }

    function shouldNormalizeBrParagraphContainer(container) {
      if (!container || container.querySelector('p')) return false;

      const inlineTags = new Set([
        'a', 'abbr', 'b', 'bdi', 'bdo', 'br', 'cite', 'code', 'em', 'font',
        'i', 'img', 'kbd', 'mark', 'q', 'ruby', 'rb', 'rp', 'rt', 's', 'small',
        'span', 'strong', 'sub', 'sup', 'time', 'u', 'var',
      ]);
      let brCount = 0;
      let textLength = 0;

      for (const node of Array.from(container.childNodes)) {
        if (isBrNode(node)) {
          brCount += 1;
        } else if (node.nodeType === 3) {
          textLength += node.nodeValue.trim().length;
        } else if (node.nodeType === 1) {
          const tag = node.localName && node.localName.toLowerCase();
          if (!inlineTags.has(tag) && node.textContent.trim()) return false;
        }
      }

      return brCount >= 4 && textLength >= 80;
    }

    function normalizeBrParagraphContainer(doc, container) {
      const originalNodes = Array.from(container.childNodes);
      const fragment = doc.createDocumentFragment();
      let pending = [];
      let breakNodes = [];
      let breakCount = 0;
      let paragraphCount = 0;

      const flushPending = () => {
        while (pending.length && isBlankTextNode(pending[0])) pending.shift();
        while (pending.length && isBlankTextNode(pending[pending.length - 1])) pending.pop();
        if (!pending.some(hasParagraphContent)) {
          pending = [];
          return;

        const p = doc.createElement('p');
        p.className = '__readany_br_paragraph';
        for (const node of pending) p.appendChild(node);
        fragment.appendChild(p);
        pending = [];
        paragraphCount += 1;

      const commitBreak = () => {
        if (!breakNodes.length) return;
        if (breakCount >= 2) flushPending();
        else pending.push(...breakNodes);
        breakNodes = [];
        breakCount = 0;
      };

      for (const node of Array.from(container.childNodes)) {
        if (isBrNode(node)) {
          breakNodes.push(node);
          breakCount += 1;
        } else if (isBlankTextNode(node) && breakCount > 0) {
          breakNodes.push(node);
        } else {

          pending.push(node);
        }
      }

      commitBreak();
      flushPending();

      if (paragraphCount < 2) {

        return false;

          }

    // ─── TOC conversion ───

                rect.bottom > 0 && rect.top < vh;

          textNode = walker.nextNode();
        }
        
        var result = normalizeTTSText(texts.join(' '));
        return { 
          text: result, 
          debug: {
            isPaginated: isPaginated,
            pSize: pSize,
            pStart: pStart,
            nodeCount: nodeCount,
            visibleCount: visibleCount,
            firstRect: firstRectInfo
          }
        };
      } catch (e) { 
        return { text: '', error: String(e) };
      }

    function getCurrentRendererContent() {
      const contents = getRendererContents();
      return contents[0] || null;
    }

    function anchorToRange(doc, anchor) {
      if (!doc || !anchor) return null;
      if (anchor instanceof Range) return anchor;
      if (!(anchor instanceof Node)) return null;
      try {
        const range = doc.createRange();
        if (anchor.nodeType === Node.TEXT_NODE) {
          range.selectNodeContents(anchor);
        } else {
          range.selectNode(anchor);
        }
        return range;
      } catch (e) {
        console.log('[ttsRange] failed to normalize anchor:', e);
        return null;
      }
    }

    function resolveRangeForCfi(cfi) {
      if (!view || !cfi || !view.resolveCFI) return null;
      const contents = getRendererContents();
      if (!contents.length) return null;

      try {
        const resolved = view.resolveCFI(cfi);
        if (!resolved) return null;

        if (resolved.index != null) {
          const direct = contents.find((content) => content.index === resolved.index && content.doc);
          if (direct?.doc && typeof resolved.anchor === 'function') {
            try {
              const range = anchorToRange(direct.doc, resolved.anchor(direct.doc));
              if (range) return { range, doc: direct.doc, index: direct.index ?? resolved.index };
            } catch {}
          }
        }

        if (typeof resolved.anchor === 'function') {
          for (const content of contents) {
            if (!content?.doc) continue;
            try {
              const range = anchorToRange(content.doc, resolved.anchor(content.doc));
              if (range) return { range, doc: content.doc, index: content.index ?? resolved.index ?? 0 };
            } catch {}
          }
        }
      } catch (e) {
        console.log('[ttsRange] failed to resolve CFI:', e);
      }

    }

    function getPaginatedVisibleRangeCandidates(renderer) {
      const start = Number(renderer && renderer.start || 0);
      const end = Number(renderer && renderer.end || 0);
      const size = Number(renderer && renderer.size || 0);
      const candidates = [];

      if (Number.isFinite(start) && Number.isFinite(size) && size > 0) {
        candidates.push({ left: start - size, right: start, source: 'legacy-offset' });
        candidates.push({ left: start, right: start + size, source: 'size-fallback' });
      }

      if (Number.isFinite(start) && Number.isFinite(end) && end > start) {

      }

      return candidates.filter((candidate, index, list) => {
        return candidate.right > candidate.left &&

    function rectIntersectsPaginatedRange(rect, range) {

    function scorePaginatedVisibleRange(doc, range) {
      if (!doc || !doc.body) return 0;

          if (shouldSkipTTSNode(node.parentElement)) return NodeFilter.FILTER_REJECT;

            ? NodeFilter.FILTER_ACCEPT

      let score = 0;
      let visited = 0;
      let textNode = walker.nextNode();
      while (textNode && visited < 500) {

        if (text) {

            textRange.selectNodeContents(textNode);

    function pickPaginatedVisibleRange(doc, renderer) {
      const candidates = getPaginatedVisibleRangeCandidates(renderer);
      if (candidates.length <= 1) return candidates[0] || null;

      const legacyRange = candidates.find((range) => range.source === 'legacy-offset') || null;
      if (legacyRange && scorePaginatedVisibleRange(doc, legacyRange) > 0) return legacyRange;

      const rendererRange = candidates.find((range) => range.source === 'renderer') || null;
      if (rendererRange && scorePaginatedVisibleRange(doc, rendererRange) > 0) return rendererRange;

      const fallbackRange = candidates.find((range) => range.source === 'size-fallback') || null;

    let ttsVisibleRangeByDoc = new WeakMap();

      ttsVisibleRangeByDoc.set(doc, range);

      if (!container) return null;

    function getReaderViewportRect() {

        left: 0,
        top: 0,
        right: window.innerWidth || document.documentElement.clientWidth || 0,
        bottom: window.innerHeight || document.documentElement.clientHeight || 0,

          left: Math.max(viewRect.left, viewport.left),
          top: Math.max(viewRect.top, viewport.top),
          right: Math.min(viewRect.right, viewport.right),
          bottom: Math.min(viewRect.bottom, viewport.bottom),

      } catch (e) {

    function mapIframeRectToHost(rect, doc) {

        if (!iframe || !iframe.getBoundingClientRect) return rect;
        const iframeRect = iframe.getBoundingClientRect();
        const scaleX = iframe.clientWidth > 0 ? iframeRect.width / iframe.clientWidth : 1;
        const scaleY = iframe.clientHeight > 0 ? iframeRect.height / iframe.clientHeight : 1;
        return {
          left: iframeRect.left + rect.left * scaleX,
          top: iframeRect.top + rect.top * scaleY,
          right: iframeRect.left + rect.right * scaleX,
          bottom: iframeRect.top + rect.bottom * scaleY,
          width: rect.width * scaleX,
          height: rect.height * scaleY,

      } catch (e) {

      }

          right: rect.right,

        .filter(function(content) { return !!(content && content.doc); })
        .map(function(content) {

        .filter(function(item) {

        return false;
      }
    }

    function isRangeStartVisibleInReader(range, renderer, win) {
      if (!range || !renderer || !win) return false;
      try {
        const rects = Array.from(range.getClientRects ? range.getClientRects() : []);
        const doc = getRangeDocument(range);
        if (!rects.length) {
          return isRectVisibleInReader(range.getBoundingClientRect(), renderer, win, doc);
        }
        return isRectVisibleInReader(rects[0], renderer, win, doc);
      } catch (e) {
        console.log('[visibleTTSSegments] failed to inspect range start rect:', e);
        return false;
      }
    }

    function getVisibleBlocksForTTS(doc, renderer) {
      const blockSelector = "p, h1, h2, h3, h4, h5, h6, li, blockquote, dd, dt, figcaption, pre, td, th";
      const blocks = doc.querySelectorAll(blockSelector);
      const win = doc.defaultView;

        if (shouldSkipTTSNode(block)) return false;

      return Array.from(doc.querySelectorAll(blockSelector)).filter((block) => {

    function resolveTextPosition(textNodes, absoluteOffset, isEnd) {

    }

      const matches = normalized.match(/[^。！？!?；;\n]+[。！？!?；;…]?/gu) || [];
      return (matches.length ? matches : [normalized]).map((segment) => segment.trim()).filter(Boolean);
    }

    const TTS_FOOTNOTE_MARKER_PATTERN = /(?:\s*(?:\[(?:\d{1,4}|[一二三四五六七八九十百千万零〇两]{1,8}|[ivxlcdmIVXLCDM]{1,10})\]|［(?:\d{1,4}|[一二三四五六七八九十百千万零〇两]{1,8}|[ivxlcdmIVXLCDM]{1,10})］|【(?:\d{1,4}|[一二三四五六七八九十百千万零〇两]{1,8}|[ivxlcdmIVXLCDM]{1,10})】|〔(?:\d{1,4}|[一二三四五六七八九十百千万零〇两]{1,8}|[ivxlcdmIVXLCDM]{1,10})〕|［?（(?:\d{1,4}|[一二三四五六七八九十百千万零〇两]{1,8}|[ivxlcdmIVXLCDM]{1,10})）］?|\((?:\d{1,4}|[一二三四五六七八九十百千万零〇两]{1,8}|[ivxlcdmIVXLCDM]{1,10})\)))+/gu;
    const TTS_FOOTNOTE_MARKER_ONLY_PATTERN = /^(?:\s*(?:\[(?:\d{1,4}|[一二三四五六七八九十百千万零〇两]{1,8}|[ivxlcdmIVXLCDM]{1,10})\]|［(?:\d{1,4}|[一二三四五六七八九十百千万零〇两]{1,8}|[ivxlcdmIVXLCDM]{1,10})］|【(?:\d{1,4}|[一二三四五六七八九十百千万零〇两]{1,8}|[ivxlcdmIVXLCDM]{1,10})】|〔(?:\d{1,4}|[一二三四五六七八九十百千万零〇两]{1,8}|[ivxlcdmIVXLCDM]{1,10})〕|［?（(?:\d{1,4}|[一二三四五六七八九十百千万零〇两]{1,8}|[ivxlcdmIVXLCDM]{1,10})）］?|\((?:\d{1,4}|[一二三四五六七八九十百千万零〇两]{1,8}|[ivxlcdmIVXLCDM]{1,10})\)))+\s*$/u;
    const TTS_SKIPPED_ELEMENT_SELECTOR = [

      'style',
      'rt',
      'rp',
      'sup',
      '.readany-translation',
      '.readany-scene-insert',
      '[role="doc-noteref"]',
      '[role="doc-footnote"]',
      '[epub\\:type~="noteref"]',
      '[epub\\:type~="footnote"]',
      '[type~="noteref"]',
      '[type~="footnote"]',
      'a[href^="#fn"]',
      'a[href^="#footnote"]',
      'a[href*="footnote"]',
      'a[href*="note"]',
      'a.noteref',
      'a.footnote',
      '.noteref',
      '.footnote',
      '.footnote-ref',
      '.endnote',
      '.duokan-footnote',
      '.calibre-footnote',

    function getTTSCfiStartIdentity(cfi) {
      const raw = String(cfi || '').trim();

        ? raw.slice(8, -1)
        : raw;
      const bangIndex = inner.indexOf('!');
      if (bangIndex < 0) return stripCfiAssertions(inner);

      const sectionPath = stripCfiAssertions(inner.slice(0, bangIndex));
      const localPath = stripCfiAssertions(inner.slice(bangIndex + 1));
      const commaIndex = localPath.indexOf(',');
      if (commaIndex < 0) return `${sectionPath}!${localPath}`;

      const commonPath = localPath.slice(0, commaIndex);
      const rangePath = localPath.slice(commaIndex + 1);
      const rangeEndIndex = rangePath.indexOf(',');
      const startPath = rangeEndIndex >= 0 ? rangePath.slice(0, rangeEndIndex) : rangePath;

    function summarizeTTSSegmentsForLog(segments, limit) {
      return (segments || []).slice(0, limit || 8).map(function(segment, index) {

          cfi: segment && segment.cfi || null,
          length: text.length,
          text: text,
        };

    function collectTTSSegmentsFromEngine(count, alignCfi, alignRange) {
      const tts = view && view.tts;
      if (!tts) return [];

      // Prefer range-based alignment (reliable boundary comparison) over CFI string
      // matching (fragile — depends on exact serialization equality).
      if (alignRange && typeof tts.from === 'function') {

          // If we pass a full sentence range, range.end overshoots detailRange[0].start
          // and skips the first sentence. Collapse to start (caret) so the comparison
          // correctly lands on the sentence that CONTAINS the visible position.

          if (caretRange.collapse) caretRange.collapse(true); // collapse to start

        } catch (e) {

        const identity = getTTSSegmentIdentity(detail.cfi, text);

    function getTTSSegmentContextFromEngine(cfi, beforeCount, afterCount) {

          } else if (typeof tts.highlightCfi === 'function') {

          }

          typeof tts.currentDetail === 'function'
            ? tts.currentDetail()
            : null;
        const currentText =
          current && current.text
            ? normalizeTTSText(current.text)
            : '';
        const currentIdentity = currentText ? getTTSSegmentIdentity(current && current.cfi, currentText) : null;

          const result = [];
          const seen = new Set();
          for (const detail of details || []) {

            const text = normalizeTTSText(detail.text);
            const identity = getTTSSegmentIdentity(detail.cfi, text);

          typeof tts.collectDetails === 'function'

          typeof tts.collectDetails === 'function'
            ? tts.collectDetails(Math.max(0, afterCount || 0), {
                includeCurrent: false,
                offset: 1,

            : [];

          before: normalize(before),
          after: normalize(after),
        };
      } catch (e) {

    function getTTSSegmentBoundaryNode(range, docNode) {
      if (!range || !range.startContainer) return null;
      const container = range.startContainer;
      if (container.nodeType === docNode.TEXT_NODE) {

      }

        container.childNodes &&
        Number.isInteger(range.startOffset) &&
        range.startOffset >= 0 &&
        range.startOffset < container.childNodes.length
      ) {

        return child.nodeType === docNode.TEXT_NODE ? child.parentElement : child;
      }

    }

    function extractTTSSegmentsFromDocument(
      doc,
      sectionIndex,
      maxCount,
      anchorRange,
      endAnchorRange,
    ) {
      try {
        if (!doc || !view || typeof view.getCFI !== 'function') return [];

        const segments = [];
        const seen = new Set();
        const docNode = doc.defaultView && doc.defaultView.Node ? doc.defaultView.Node : Node;
        const anchorNode = getTTSSegmentBoundaryNode(anchorRange, docNode);
        const endAnchorNode = getTTSSegmentBoundaryNode(endAnchorRange, docNode);
        let started = !anchorNode;

        for (const block of blocks) {
          if (!started && anchorNode) {
            if (block === anchorNode || block.contains(anchorNode)) {
              started = true;
            } else if (
              anchorNode.compareDocumentPosition &&
              (anchorNode.compareDocumentPosition(block) & docNode.DOCUMENT_POSITION_FOLLOWING)
            ) {

            }

          if (!started) continue;
          if (endAnchorNode) {

              block === endAnchorNode ||
              block.contains(endAnchorNode) ||
              (endAnchorNode.contains && endAnchorNode.contains(block));

              endAnchorNode.compareDocumentPosition &&
              (endAnchorNode.compareDocumentPosition(block) &
                docNode.DOCUMENT_POSITION_FOLLOWING);

          const textNodes = getTTSTextNodes(block).map((node) => {

            return { node, text };
          }).filter((item) => item.text.trim().length > 0);
          if (!textNodes.length) continue;

          let absoluteText = '';
          const positionedNodes = textNodes.map((item) => {
            const start = absoluteText.length;
            absoluteText += item.text;
            return {
              node: item.node,
              start,
              end: absoluteText.length,
            };
          });

          const rawSegments = segmenter
            ? Array.from(segmenter.segment(absoluteText)).map((item) => ({
                start: item.index,
                end: item.index + item.segment.length,
              }))
            : fallbackSentenceSegments(absoluteText).reduce((acc, sentence) => {
                const start = absoluteText.indexOf(sentence, acc.lastIndex || 0);
                if (start >= 0) {
                  acc.items.push({ start, end: start + sentence.length });
                  acc.lastIndex = start + sentence.length;
                }
                return acc;
              }, { items: [], lastIndex: 0 }).items;
          const normalizedSegments = rawSegments.length
            ? rawSegments
            : [{ start: 0, end: absoluteText.length }];

          for (const rawSegment of normalizedSegments) {
            let start = rawSegment.start;
            let end = rawSegment.end;
            while (start < end && /\s/u.test(absoluteText[start])) start++;
            while (end > start && /\s/u.test(absoluteText[end - 1])) end--;
            if (end - start < 2) continue;

            const startPos = resolveTextPosition(positionedNodes, start, false);
            const endPos = resolveTextPosition(positionedNodes, end, true);
            if (!startPos || !endPos) continue;

            const range = doc.createRange();
            range.setStart(startPos.node, startPos.offset);
            range.setEnd(endPos.node, endPos.offset);

            const text = normalizeTTSText(absoluteText.slice(start, end));
            if (!text) continue;

            try {
              const cfi = view.getCFI(sectionIndex, range);
              const identity = getTTSSegmentIdentity(cfi, text);
              if (!cfi || seen.has(identity)) continue;
              seen.add(identity);
              segments.push({ text, cfi });
              if (segments.length >= limit) return segments;
            } catch (e) {
              console.log('[hrefTTSSegments] failed to convert range to CFI:', e);
            }
          }
        }

        return segments;
      } catch (e) {
        console.log('[hrefTTSSegments] extract error:', e);
        return [];
      }
    }

    async function resolveHrefForTTSSegments(href) {
      if (!href || !currentBook || !currentBook.sections || !view) {
        return { resolved: null, sectionIndex: -1 };
      }

      let resolved = null;
      try {
        if (typeof view.resolveNavigation === 'function') {
          resolved = await Promise.resolve(view.resolveNavigation(href));
        } else if (typeof currentBook.resolveHref === 'function') {
          resolved = await Promise.resolve(currentBook.resolveHref(href));
        }
      } catch (e) {
        console.log('[hrefTTSSegments] failed to resolve href:', href, e);
      }

      let sectionIndex = Number.isInteger(resolved && resolved.index) ? resolved.index : -1;
      if (sectionIndex < 0) {
        const hrefWithoutHash = String(href).split('#')[0];
        sectionIndex = Array.from(currentBook.sections).findIndex(function(section) {
          const sectionHref = String(section && section.href || '').split('#')[0];
          return (
            sectionHref === href ||
            sectionHref === hrefWithoutHash ||
            sectionHref.endsWith('/' + hrefWithoutHash)
          );
        });
      }

      return { resolved, sectionIndex };
    }

    async function getChapterTTSSegmentsFromBook(startHref, endHref, maxCount) {
      try {
        if (!startHref || !currentBook || !currentBook.sections || !view) return [];
        const startLocation = await resolveHrefForTTSSegments(startHref);
        const resolved = startLocation.resolved;
        const sectionIndex = startLocation.sectionIndex;
        if (sectionIndex < 0 || sectionIndex >= currentBook.sections.length) return [];
        const section = currentBook.sections[sectionIndex];
        if (!section || typeof section.createDocument !== 'function') return [];

        const doc = await section.createDocument();
        let anchorRange = null;
        if (resolved && typeof resolved.anchor === 'function') {
          try {
            anchorRange = anchorToRange(doc, resolved.anchor(doc));
          } catch (e) {
            anchorRange = null;
          }
        }

        let endAnchorRange = null;
        if (endHref && String(endHref) !== String(startHref)) {
          const endLocation = await resolveHrefForTTSSegments(endHref);
          if (
            endLocation.sectionIndex === sectionIndex &&
            endLocation.resolved &&
            typeof endLocation.resolved.anchor === 'function'
          ) {
            try {
              endAnchorRange = anchorToRange(doc, endLocation.resolved.anchor(doc));
            } catch (e) {
              endAnchorRange = null;
            }
          }
        }

        return extractTTSSegmentsFromDocument(
          doc,
          sectionIndex,
          maxCount,
          anchorRange,
          endAnchorRange,
        );
      } catch (e) {
        console.log('[chapterTTSSegments] error:', e);
        return [];
      }
    }

    async function getHrefTTSSegmentsFromBook(href, maxCount) {
      return getChapterTTSSegmentsFromBook(href, null, maxCount);
    }

    async function getSectionTTSSegmentsFromBook(sectionIndex, maxCount) {
      try {
        if (!currentBook || !currentBook.sections || !view) return [];
        const index = Number(sectionIndex);
        if (!Number.isInteger(index) || index < 0 || index >= currentBook.sections.length) {
          return [];
        }

        const section = currentBook.sections[index];
        if (!section || typeof section.createDocument !== 'function') return [];

        const doc = await section.createDocument();
        return extractTTSSegmentsFromDocument(doc, index, maxCount, null, null);
      } catch (e) {
        console.log('[sectionTTSSegments] error:', e);
        return [];
      }
    }

    function extractVisibleTTSSegments(alignCfi) {
      try {
        const renderer = view && view.renderer;
        const contents = getRendererContents();
        if (!renderer || !contents.length) return [];
        ttsVisibleRangeByDoc = new WeakMap();
        const scanContents = getVisibleContentsForTTS(contents, renderer);
        const segments = [];
        const stats = {
          contentsCount: contents.length,
          scannedContentsCount: scanContents.length,
          visibleBlockCount: 0,
          rawSentenceCount: 0,
          skippedTooShort: 0,
          skippedNoBoundary: 0,
          skippedNotStartVisible: 0,
          skippedNotVisible: 0,
          skippedEmptyText: 0,
          skippedCFI: 0,
          skippedDuplicate: 0,
          startVisibilityMode: 'range-intersection',
        };
        const seenVisibleIdentities = new Set();
        // Track the first visible range for range-based TTS cursor alignment
        // Must be declared here (outer scope) so it's accessible after both loops close.
        let firstVisibleRange = null;

        for (var contentIndex = 0; contentIndex < scanContents.length; contentIndex++) {
          const current = scanContents[contentIndex];
          if (!current || !current.doc) continue;
          const doc = current.doc;
          const win = doc.defaultView;
          if (!win) continue;
          const sectionIndex = typeof current.index === 'number' ? current.index : currentSectionIndex;
          const visibleBlocks = getVisibleBlocksForTTS(doc, renderer);
          stats.visibleBlockCount += visibleBlocks.length;
          const lang =
            doc.documentElement.lang ||
            doc.documentElement.getAttribute('xml:lang') ||
            doc.body.lang ||
            navigator.language ||
            'en';
          const segmenter =
            typeof Intl !== 'undefined' && Intl.Segmenter
              ? new Intl.Segmenter(lang, { granularity: 'sentence' })
              : null;

          for (var blockIndex = 0; blockIndex < visibleBlocks.length; blockIndex++) {
            const block = visibleBlocks[blockIndex];
            const textNodes = getTTSTextNodes(block).map((node) => {
              const text = node.nodeValue || '';
              return { node, text };
            }).filter((item) => item.text.trim().length > 0);
            if (!textNodes.length) continue;

            var absoluteText = '';
            const positionedNodes = textNodes.map((item) => {
              const start = absoluteText.length;
              absoluteText += item.text;
              return {
                node: item.node,
                start,
                end: absoluteText.length,
              };
            });

            const rawSegments = segmenter
              ? Array.from(segmenter.segment(absoluteText)).map((item) => ({
                  start: item.index,
                  end: item.index + item.segment.length,
                }))
              : fallbackSentenceSegments(absoluteText).reduce((acc, sentence) => {
                  const start = absoluteText.indexOf(sentence, acc.lastIndex || 0);
                  if (start >= 0) {
                    acc.items.push({ start, end: start + sentence.length });
                    acc.lastIndex = start + sentence.length;
                  }
                  return acc;
                }, { items: [], lastIndex: 0 }).items;

            const normalizedSegments = rawSegments.length
              ? rawSegments
              : [{ start: 0, end: absoluteText.length }];
            stats.rawSentenceCount += normalizedSegments.length;

            for (var si = 0; si < normalizedSegments.length; si++) {
              let start = normalizedSegments[si].start;
              let end = normalizedSegments[si].end;

              while (start < end && /\s/u.test(absoluteText[start])) start++;
              while (end > start && /\s/u.test(absoluteText[end - 1])) end--;
              if (end - start < 2) {
                stats.skippedTooShort++;
                continue;
              }

              const startPos = resolveTextPosition(positionedNodes, start, false);
              const endPos = resolveTextPosition(positionedNodes, end, true);
              if (!startPos || !endPos) {
                stats.skippedNoBoundary++;
                continue;
              }

              const range = doc.createRange();
              range.setStart(startPos.node, startPos.offset);
              range.setEnd(endPos.node, endPos.offset);
              if (!isRangeStartVisibleInReader(range, renderer, win)) {
                stats.skippedNotVisible++;
                stats.skippedNotStartVisible++;
                continue;
              }

              const text = normalizeTTSText(absoluteText.slice(start, end));
              if (!text) {
                stats.skippedEmptyText++;
                continue;
              }

              // Capture the first visible range for reliable TTS cursor alignment
              if (!firstVisibleRange) {
                firstVisibleRange = range;
              }

              try {
                const cfi = view && view.getCFI ? view.getCFI(sectionIndex, range) : '';
                if (cfi) {
                  const identity = getTTSSegmentIdentity(cfi, text);
                  if (seenVisibleIdentities.has(identity)) {
                    stats.skippedDuplicate++;
                    continue;
                  }
                  seenVisibleIdentities.add(identity);
                  segments.push({ text, cfi });
                } else {
                  stats.skippedCFI++;
                }
              } catch (e) {
                stats.skippedCFI++;
                console.log('[visibleTTSSegments] failed to convert range to CFI:', e);
              }
            }
          }
        }

        // Use range-based alignment (preferred: uses boundary comparison, not CFI string equality)
        // Fall back to CFI string alignment for older tts.js builds without tts.from()
        const firstVisibleCfi = segments[0]?.cfi || null;
        const resolvedAlignRange = resolveRangeForCfi(alignCfi);
        const alignedSegments = segments.length
          ? collectTTSSegmentsFromEngine(
              alignCfi ? 500 : segments.length,
              alignCfi || firstVisibleCfi,
              resolvedAlignRange?.range || firstVisibleRange
            )
          : [];
        let returnSource = segments.length ? 'direct-visible' : 'no-visible-segments';
        let filteredAlignedCount = 0;
        let filteredAlignedPreview = [];
        let returnedSegments = segments;
        if (alignedSegments.length && segments.length) {
          const visibleIdentities = new Set(
            segments.map((segment) => getTTSSegmentIdentity(segment.cfi, segment.text))
          );
          const filtered = alignedSegments.filter((segment) =>
            visibleIdentities.has(getTTSSegmentIdentity(segment.cfi, segment.text))
          );
          filteredAlignedCount = filtered.length;
          filteredAlignedPreview = summarizeTTSSegmentsForLog(filtered, 8);
          if (filtered.length === segments.length) {
            returnSource = 'aligned-filtered';
            returnedSegments = filtered;
          } else if (filtered.length > 0) {
            returnSource = 'direct-partial-filtered-fallback';
            returnedSegments = segments;
          } else if (alignCfi) {
            const alignedStart = alignedSegments[0] || null;
            const alignedStartIdentity = alignedStart
              ? getTTSSegmentIdentity(alignedStart.cfi, alignedStart.text)
              : null;
            const visibleStartIndex = alignedStartIdentity
              ? segments.findIndex(
                  (segment) =>
                    getTTSSegmentIdentity(segment.cfi, segment.text) === alignedStartIdentity
                )
              : -1;
            if (visibleStartIndex >= 0) {
              returnSource = 'direct-aligned-slice';
              returnedSegments = segments.slice(visibleStartIndex);
            } else {
              returnSource = 'direct-fallback';
              returnedSegments = segments;
            }
          } else {
            returnSource = 'direct-visible';
            returnedSegments = segments;
          }
        }

        window.__lastVisibleTTSDiagnostics = {
          alignCfi: alignCfi || null,
          firstVisibleCfi: firstVisibleCfi,
          firstVisibleText: segments[0] && segments[0].text || null,
          directCount: segments.length,
          alignedCount: alignedSegments.length,
          filteredAlignedCount: filteredAlignedCount,
          returnedCount: returnedSegments.length,
          returnSource: returnSource,
          stats: stats,
          directPreview: summarizeTTSSegmentsForLog(segments, 8),
          alignedPreview: summarizeTTSSegmentsForLog(alignedSegments, 8),
          filteredAlignedPreview: filteredAlignedPreview,
          returnedPreview: summarizeTTSSegmentsForLog(returnedSegments, 8),
        };
        console.log('[visibleTTSSegments] diagnostics', JSON.stringify(window.__lastVisibleTTSDiagnostics));
        return returnedSegments;
      } catch (e) {
        console.log('[visibleTTSSegments] extraction error:', e);
        const fallbackSegments = alignCfi
          ? collectTTSSegmentsFromEngine(500, alignCfi, resolveRangeForCfi(alignCfi)?.range || null)
          : [];
        window.__lastVisibleTTSDiagnostics = {
          alignCfi: alignCfi || null,
          extractionError: String(e),
          returnSource: alignCfi ? 'engine-align-fallback' : 'no-visible-segments',
          directCount: 0,
          alignedCount: fallbackSegments.length,
          filteredAlignedCount: 0,
          returnedCount: fallbackSegments.length,
          stats: {
            startVisibilityMode: 'range-intersection',
          },
          directPreview: [],
          alignedPreview: summarizeTTSSegmentsForLog(fallbackSegments, 8),
          filteredAlignedPreview: [],
          returnedPreview: summarizeTTSSegmentsForLog(fallbackSegments, 8),
        };
        console.log('[visibleTTSSegments] diagnostics', JSON.stringify(window.__lastVisibleTTSDiagnostics));
        return fallbackSegments;
      }
    }

    // Flash highlight for AI citation - temporarily hide existing annotation, show flash, then restore
    window.flashHighlight = async function(cfi, color, duration) {

      const flashDuration = duration || 500;
      
      // Get existing annotation for this CFI
      const existingAnnotation = userAnnotations.get(cfi);
      
      // If there's an existing annotation, temporarily remove it

        try {
          await view.deleteAnnotation(existingAnnotation);

          console.log('[flashHighlight] error removing existing:', e);

      // Add flash highlight

        await view.addAnnotation({ value: cfi, color: flashColor });

        console.log('[flashHighlight] error adding flash:', e);

          try {
            await view.addAnnotation(existingAnnotation);
          } catch (e2) {}
        }
        return;

      // Remove flash highlight after duration and restore existing annotation
      setTimeout(async () => {
        try {
          await view.deleteAnnotation({ value: cfi });
        } catch (e) {
          console.log('[flashHighlight] error removing flash:', e);

    // ─── Polyfills ───
    Object.groupBy ??= function (iterable, fn) {
      const obj = Object.create(null);
      let i = 0;
      for (const v of iterable) { const k = fn(v, i++); if (k in obj) obj[k].push(v); else obj[k] = [v]; }
      return obj;
    };
    Map.groupBy ??= function (iterable, fn) {
      const map = new Map();
      let i = 0;
      for (const v of iterable) { const k = fn(v, i++); const l = map.get(k); if (l) l.push(v); else map.set(k, [v]); }
      return map;
    };

    // ─── Chapter Extraction for Vectorization ───
    function isPDFBookMessage(msg) {
      const mimeType = (msg.mimeType || '').split(';')[0].trim().toLowerCase();
      return mimeType === 'application/pdf' || /\.pdf$/i.test(msg.fileName || '');
    }

    async function createBookFileFromMessage(msg) {
      if (msg.base64) {
        const binary = atob(msg.base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return new File([bytes], msg.fileName || 'book.epub', {
          type: msg.mimeType || 'application/epub+zip'
        });
      }

      if (msg.uri) {
        const res = await fetch(msg.uri);
        const isLocalFileStatus = res.status === 0 && /^file:\/\//i.test(msg.uri);
        if (!res.ok && !isLocalFileStatus) throw new Error(`Failed to fetch: ${res.status}`);
        const blob = await res.blob();
        return new File([blob], msg.fileName || 'book.epub', {
          type: msg.mimeType || blob.type || 'application/octet-stream'
        });
      }

      throw new Error('No book data provided');
    }

    async function handleExtractBookChapters(msg) {
      try {
        if (isPDFBookMessage(msg)) {
          if (typeof window._extractPDFChapters !== 'function') {
            throw new Error('PDF extraction is not available in this reader build');
          }

          postToRN('debug', {
            message: `[PDFExtract] start ${JSON.stringify({
              fileName: msg.fileName || '',
              mimeType: msg.mimeType || '',
              base64Length: msg.base64 ? msg.base64.length : 0
            })}`
          });

          const file = await createBookFileFromMessage(msg);
          const chapters = await window._extractPDFChapters(file, {
            onProgress: (detail) => {
              postToRN('debug', { message: `[PDFExtract] page ${JSON.stringify(detail)}` });
            }
          });

          postToRN('debug', {
            message: `[PDFExtract] done ${JSON.stringify({
              chapters: chapters.length,
              segments: chapters.reduce((sum, chapter) => sum + (chapter.segments?.length || 0), 0),
              contentLength: chapters.reduce((sum, chapter) => sum + (chapter.content?.length || 0), 0)
            })}`
          });

          postToRN('chaptersExtracted', { chapters });
          return;
        }

        currentBook = await makeBook(await createBookFileFromMessage(msg));
        await handleExtractChapters();
      } catch (err) {
        console.error('[WebView] Error extracting book chapters:', err);
        postToRN('chaptersExtracted', { error: String(err) });
      }
    }

    function normalizeBookTextSample(text) {
      return String(text || '')
        .replace(/\u00ad/g, '')
        .replace(/[ \t\f\v]+/g, ' ')
        .replace(/\n\s*\n\s*\n+/g, '\n\n')
        .trim();
    }

    async function createBookForTextSample(msg) {
      if (!msg.uri) throw new Error('A book URI is required for text sampling');
      if (isPDFBookMessage(msg) && typeof window._makePDFFromURL === 'function') {
        return window._makePDFFromURL(msg.uri, msg.fileName || 'book.pdf');
      }
      return makeBook(await createBookFileFromMessage({ ...msg, base64: undefined }));
    }

    async function extractSectionTextSample(section) {
      if (!section || typeof section.createDocument !== 'function') return '';
      const doc = await section.createDocument();
      try {
        return normalizeBookTextSample(doc.body?.innerText || doc.body?.textContent || '');
      } finally {
        if (doc.documentElement) doc.documentElement.innerHTML = '';
      }
    }

    async function collectTextSampleRegion(sections, indices, budget, seen, reverseOutput) {
      if (budget <= 0) return '';
      const parts = [];
      let length = 0;

      for (const index of indices) {
        if (length >= budget) break;
        if (seen.has(index)) continue;
        seen.add(index);
        try {
          const text = await extractSectionTextSample(sections[index]);
          if (!text) continue;
          const separatorLength = parts.length > 0 ? 2 : 0;
          const available = Math.max(0, budget - length - separatorLength);
          if (available === 0) break;
          const part = text.slice(0, available);
          if (reverseOutput) parts.unshift(part);
          else parts.push(part);
          length += separatorLength + part.length;
        } catch (err) {
          console.warn(`[TextSample] Failed to extract section ${index}:`, err);
        }
      }

      return parts.join('\n\n');
    }

    async function handleExtractBookTextSample(msg) {
      const requestedMax = Number(msg.maxChars);
      const maxChars = Math.min(
        48000,
        Math.max(1, Number.isFinite(requestedMax) ? Math.floor(requestedMax) : 48000)
      );
      let sampleBook = null;

      try {
        sampleBook = await createBookForTextSample(msg);
        const sections = Array.isArray(sampleBook?.sections) ? sampleBook.sections : [];
        if (sections.length === 0) throw new Error('The book contains no readable sections');

        const indices = Array.from({ length: sections.length }, (_, index) => index);
        const middleStart = Math.max(0, Math.floor(sections.length / 2));
        const seen = new Set();
        const regionBudget = Math.max(1, Math.floor(maxChars / 3));
        const start = await collectTextSampleRegion(
          sections,
          indices,
          regionBudget,
          seen,
          false
        );
        const middle = await collectTextSampleRegion(
          sections,
          indices.slice(middleStart),
          regionBudget,
          seen,
          false
        );
        const end = await collectTextSampleRegion(
          sections,
          indices.slice().reverse(),
          maxChars - start.length - middle.length,
          seen,
          true
        );
        const text = [start, middle, end]
          .filter(Boolean)
          .join('\n\n[…]\n\n')
          .slice(0, maxChars);

        postToRN('textSampleExtracted', { text });
      } catch (err) {
        console.error('[WebView] Error extracting a bounded text sample:', err);
        postToRN('textSampleExtracted', { error: String(err) });
      } finally {
        try {
          await sampleBook?.destroy?.();
        } catch {}
      }
    }

    async function handleExtractChapters() {
      if (!currentBook) {
        postToRN('chaptersExtracted', { error: 'No book loaded' });
        return;
      }

      try {
        const sections = currentBook.sections || [];
        const toc = currentBook.toc || [];

        // Build map of href to title mapping
        const tocMap = new Map();
        function walkToc(items) {
          for (const item of items) {
            if (item.label) {
              tocMap.set(item.index, item.label);
              if (item.href) {
                const base = item.href.split("#")[0];
                tocMap.set(base, item.label);
                tocMap.set(item.href, item.label);
              }
            }
            if (item.subitems && item.subitems.length) {
              walkToc(item.subitems);
            }
          }
        }
        walkToc(toc);

        const chapters = [];
        let skippedNoCreateDocument = 0;

        for (let i = 0; i < sections.length; i++) {
          const section = sections[i];
          if (!section.createDocument) {
            skippedNoCreateDocument += 1;
            continue;
          }

          try {
            const doc = await section.createDocument();
            if (!doc.body) continue;

            const title = tocMap.get(i) || tocMap.get(section.href || "") || `Section ${i + 1}`;
            const CFI = window.CFI || (window.EpubCFI && window.EpubCFI.fake ? window.EpubCFI : null);
            let baseCfi = section.cfi;

            // If CFI generation is available but no base cfi, try to fake it
            if (!baseCfi && typeof CFI?.fake?.fromIndex === 'function') {
              baseCfi = CFI.fake.fromIndex(i);
            } else if (!baseCfi) {
              baseCfi = `epubcfi(/6/${(i + 1) * 2}!)`; // Fallback approximate
            }

            const segments = extractSegmentsWithCfi(doc, baseCfi, CFI);
            if (segments.length === 0) continue;

            const content = segments.map(s => s.text).join("\\n\\n");
            chapters.push({ index: i, title, content, segments });

            // Reclaim memory
            doc.documentElement.innerHTML = "";
          } catch (err) {
            console.warn(`[WebView] Failed to extract section ${i}:`, err);
          }
        }

        console.log('[WebView] Chapter extraction summary:', {
          sections: sections.length,
          chapters: chapters.length,
          segments: chapters.reduce((sum, chapter) => sum + (chapter.segments?.length || 0), 0),
          skippedNoCreateDocument
        });

        postToRN('chaptersExtracted', { chapters });
      } catch (err) {
        console.error('[WebView] Error extracting chapters:', err);
        postToRN('chaptersExtracted', { error: String(err) });
      }
    }

    function extractSegmentsWithCfi(doc, baseCfi, CFI) {
      const segments = [];
      const body = doc.body;
      if (!body) return segments;

      const blockSelector = "p, h1, h2, h3, h4, h5, h6, li, blockquote, dd, dt, figcaption, pre, td, th";
      const blocks = body.querySelectorAll(blockSelector);

      if (blocks.length === 0) {
        const text = body.textContent?.trim();
        if (text) {
          segments.push({ text, cfi: baseCfi });
        }
        return segments;
      }

      for (let i = 0; i < blocks.length; i++) {
        const block = blocks[i];
        const text = extractBlockText(block);
        if (!text || text.length < 2) continue;

        try {
          if (!CFI) {
            segments.push({ text, cfi: baseCfi });
            continue;
          }

          const textNodes = getTextNodes(block);
          if (textNodes.length === 0) {
            segments.push({ text, cfi: baseCfi });
            continue;
          }

          const range = doc.createRange();
          const firstNode = textNodes[0];
          const lastNode = textNodes[textNodes.length - 1];

          range.setStart(firstNode, 0);
          range.setEnd(lastNode, lastNode.length);

          let rangeCfi = '';
          if (typeof CFI.fromRange === 'function') {
            rangeCfi = CFI.fromRange(range);
          } else if (CFI.Generator && typeof CFI.Generator.generateRangeComponent === 'function') {
            rangeCfi = CFI.Generator.generateRangeComponent(
              range.startContainer, range.startOffset,
              range.endContainer, range.endOffset
            );
          }

          let fullCfi = baseCfi;
          if (rangeCfi) {
            if (typeof CFI.joinIndir === 'function') {
              fullCfi = CFI.joinIndir(baseCfi, rangeCfi);
            } else {
              // naive join epubcfi(/a!) and epubcfi(/b) -> epubcfi(/a!/b)
              fullCfi = baseCfi.replace('!)', '!' + rangeCfi.replace('epubcfi(', ''));
            }
          }

          segments.push({ text, cfi: fullCfi });
        } catch (e) {
          segments.push({ text, cfi: baseCfi });
        }
      }
      return segments;
    }

    // ─── Chapter Translation Handlers ───

    function handleGetChapterParagraphs() {
      try {
        // First try: view.renderer.getContents()
        var doc = null;
        var renderer = view && view.renderer;
        if (renderer && renderer.getContents) {
          var contents = renderer.getContents();
          if (contents && contents.length && contents[0] && contents[0].doc) {
            doc = contents[0].doc;
          }
        }

        // Fallback: scan iframes
        if (!doc) {
          var iframes = document.querySelectorAll('iframe');
          for (var fi = 0; fi < iframes.length; fi++) {
            try {
              var iframeDoc = iframes[fi].contentDocument || (iframes[fi].contentWindow && iframes[fi].contentWindow.document);
              if (iframeDoc && iframeDoc.body && iframeDoc.body.innerText && iframeDoc.body.innerText.trim().length > 0) {
                doc = iframeDoc;
                break;
              }
            } catch (e) { /* cross-origin, skip */ }
          }
        }

        if (!doc) {
          postToRN('chapterParagraphs', { paragraphs: [], error: 'no document found (view=' + !!view + ', renderer=' + !!renderer + ', iframes=' + document.querySelectorAll('iframe').length + ')' });
          return;
        }

        var blockSelector = "p, h1, h2, h3, h4, h5, h6, li, blockquote, dd, dt, figcaption, pre, td, th";
        var blocks = doc.querySelectorAll(blockSelector);
        var paragraphs = [];
        for (var i = 0; i < blocks.length; i++) {
          var el = blocks[i];
          var text = (el.innerText || el.textContent || '').trim();
          if (text.length < 2) continue;
          var id = 'para_' + i;
          el.setAttribute('data-translate-id', id);
          paragraphs.push({ id: id, text: text, tagName: el.tagName.toLowerCase() });
        }

        postToRN('chapterParagraphs', { paragraphs: paragraphs });
      } catch (err) {
        postToRN('chapterParagraphs', { paragraphs: [], error: String(err) });
      }
    }

    function getReaderLayoutSignature(doc) {
      var root = doc && doc.documentElement;
      var body = doc && doc.body;
      var renderer = view && view.renderer;
      return [
        root ? root.scrollWidth : 0,
        root ? root.scrollHeight : 0,
        body ? body.scrollWidth : 0,
        body ? body.scrollHeight : 0,
        renderer && typeof renderer.page !== 'undefined' ? renderer.page : '',
        renderer && typeof renderer.pages !== 'undefined' ? renderer.pages : ''
      ].join(':');
    }

    function waitForReaderLayoutStable(doc) {
      return new Promise(function(resolve) {
        var win = (doc && doc.defaultView) || window;
        var requestFrame = win.requestAnimationFrame
          ? win.requestAnimationFrame.bind(win)
          : function(callback) { return setTimeout(function() { callback(Date.now()); }, 16); };
        var previous = getReaderLayoutSignature(doc);
        var stableFrames = 0;
        var frames = 0;

        function tick() {
          frames += 1;
          var next = getReaderLayoutSignature(doc);
          if (next === previous) {
            stableFrames += 1;
          } else {
            stableFrames = 0;
            previous = next;
          }

          if (stableFrames >= 2 || frames >= 12) {
            resolve();
            return;
          }

          requestFrame(tick);
        }

        requestFrame(tick);
      });
    }

    async function handleInjectChapterTranslations(results, visibility) {
      try {
        visibility = visibility || { originalVisible: true, translationVisible: true };
        var doc = null;
        var renderer = view && view.renderer;
        if (renderer && renderer.getContents) {
          var contents = renderer.getContents();
          if (contents && contents.length && contents[0] && contents[0].doc) {
            doc = contents[0].doc;
          }
        }
        if (!doc) {
          var iframes = document.querySelectorAll('iframe');
          for (var fi = 0; fi < iframes.length; fi++) {
            try {
              var iframeDoc = iframes[fi].contentDocument || (iframes[fi].contentWindow && iframes[fi].contentWindow.document);
              if (iframeDoc && iframeDoc.body) { doc = iframeDoc; break; }
            } catch (e) {}
          }
        }
        if (!doc) return;

        // Inject CSS once
        if (!doc.getElementById('readany-chapter-translation-style')) {
          var style = doc.createElement('style');
          style.id = 'readany-chapter-translation-style';
          style.textContent = [
            '.readany-translation {',
            '  color: #6b7280;',
            '  font-size: 0.9em;',
            '  line-height: 1.5;',
            '  margin-top: 4px;',
            '  margin-bottom: 8px;',
            '  padding-left: 8px;',
            '  border-left: 2px solid #d1d5db;',
            '  opacity: 0.85;',
            '}',
            '.readany-translation[data-hidden="true"] { display: none; }',
            '.readany-translation[data-solo="true"] { color: inherit; font-size: inherit; line-height: inherit; margin-top: 0; margin-bottom: 0.8em; padding-left: 0; border-left: none; opacity: 1; }',
            '[data-translate-id][data-original-hidden="true"] { display: none; }',
            '@media (prefers-color-scheme: dark) {',
            '  .readany-translation { color: #9ca3af; border-left-color: #4b5563; }',
            '}'
          ].join('\n');
          doc.head.appendChild(style);
        }

        for (var i = 0; i < results.length; i++) {
          var r = results[i];
          if (!r.translatedText) continue;
          var el = doc.querySelector('[data-translate-id="' + r.paragraphId + '"]');
          if (!el) continue;
          el.setAttribute('data-original-hidden', String(!visibility.originalVisible));
          // Skip if already injected
          if (el.nextElementSibling && el.nextElementSibling.classList.contains('readany-translation')) {
            el.nextElementSibling.setAttribute('data-hidden', String(!visibility.translationVisible));
            el.nextElementSibling.setAttribute('data-solo', String(!visibility.originalVisible && visibility.translationVisible));
            continue;
          }

          var div = doc.createElement('div');
          div.className = 'readany-translation';
          div.setAttribute('data-para-id', r.paragraphId);
          div.setAttribute('data-hidden', String(!visibility.translationVisible));
          div.setAttribute('data-solo', String(!visibility.originalVisible && visibility.translationVisible));
          div.textContent = r.translatedText;
          el.parentNode.insertBefore(div, el.nextSibling);
        }
        await waitForReaderLayoutStable(doc);
      } catch (err) {
        console.error('[WebView] Error injecting translations:', err);
      }
    }

    function handleRemoveChapterTranslations() {
      try {
        var doc = null;
        var renderer = view && view.renderer;
        if (renderer && renderer.getContents) {
          var contents = renderer.getContents();
          if (contents && contents.length && contents[0] && contents[0].doc) {
            doc = contents[0].doc;
          }
        }
        if (!doc) {
          var iframes = document.querySelectorAll('iframe');
          for (var fi = 0; fi < iframes.length; fi++) {
            try {
              var iframeDoc = iframes[fi].contentDocument || (iframes[fi].contentWindow && iframes[fi].contentWindow.document);
              if (iframeDoc && iframeDoc.body) { doc = iframeDoc; break; }
            } catch (e) {}
          }
        }
        if (!doc) return;

        var elements = doc.querySelectorAll('.readany-translation');

        if (style) style.remove();

      }
    }

    function isInsideRubyAnnotation(node) {
      var p = node.parentNode;
      while (p && p.nodeType === 1) {
        var name = p.tagName && p.tagName.toLowerCase();
        if (name === 'rt' || name === 'rp') return true;
        p = p.parentNode;
      }
      return false;
    }

    function getTextNodes(element) {
      const walker = element.ownerDocument.createTreeWalker(
        element,
        NodeFilter.SHOW_TEXT,
        {
          acceptNode: function (node) {
            if (isInsideRubyAnnotation(node)) return NodeFilter.FILTER_REJECT;
            return NodeFilter.FILTER_ACCEPT;
          },
        }
      );
      const nodes = [];
      let node;
      while ((node = walker.nextNode())) {
        if (node.textContent && node.textContent.trim()) {
          nodes.push(node);
        }
      }
      return nodes;
    }

    function getTTSTextNodes(element) {
      const walker = element.ownerDocument.createTreeWalker(
        element,
        NodeFilter.SHOW_TEXT,
        {
          acceptNode: function (node) {
            if (isInsideRubyAnnotation(node)) return NodeFilter.FILTER_REJECT;
            if (isTTSFootnoteMarker(node.nodeValue || '')) return NodeFilter.FILTER_REJECT;
            if (shouldSkipTTSNode(node.parentElement)) return NodeFilter.FILTER_REJECT;
            return NodeFilter.FILTER_ACCEPT;
          },
        }
      );
      const nodes = [];
      let node;
      while ((node = walker.nextNode())) {
        if (node.textContent && node.textContent.trim()) {
          nodes.push(node);
        }
      }
      return nodes;
    }

    function extractBlockText(block) {
      const walker = block.ownerDocument.createTreeWalker(
        block,
        NodeFilter.SHOW_TEXT,
        {
          acceptNode: function (node) {
            if (isInsideRubyAnnotation(node)) return NodeFilter.FILTER_REJECT;
            return NodeFilter.FILTER_ACCEPT;
          },
        }
      );
      const texts = [];
      let node;
      while ((node = walker.nextNode())) {
        const text = node.textContent?.trim();
        if (text) texts.push(text);
      }
      return texts.join(" ");
    }

    // ─── Ruby Annotation (Pinyin/Zhuyin) ───
    var _rubyWordDict = null; // { "word": ["pinyin", freq] }
    var _rubyCharDict = null; // { "char": "pinyin" }
    var _rubyMode = null;     // "zh-pinyin" | "zh-zhuyin" | null

    var CJK_RE = /[一-鿿㐀-䶿豈-﫿]/;
    var RUBY_STYLE_ID = 'readany-ruby-style';
    var RUBY_PROCESSED_ATTR = 'data-ruby-processed';

    function rubyAnnotateChinese(text) {
      if ((!_rubyWordDict && !_rubyCharDict) || !text) return [{ char: text, reading: '', needsRuby: false }];
      var tokens = [];
      var i = 0;
      while (i < text.length) {
        var ch = text[i];
        if (!CJK_RE.test(ch)) {
          var j = i + 1;
          while (j < text.length && !CJK_RE.test(text[j])) j++;
          tokens.push({ char: text.slice(i, j), reading: '', needsRuby: false });
          i = j;
          continue;
        }
        var matched = false;
        if (_rubyWordDict) {
          for (var len = Math.min(4, text.length - i); len >= 2; len--) {
            var word = text.slice(i, i + len);
            var entry = _rubyWordDict[word];
            if (entry) {
              var reading = entry[0];
              var readings = reading.split(' ');
              if (readings.length === word.length) {
                for (var k = 0; k < word.length; k++) {
                  tokens.push({ char: word[k], reading: readings[k], needsRuby: true });
                }
              } else {
                tokens.push({ char: word, reading: reading, needsRuby: true });
              }
              i += len;
              matched = true;
              break;
            }
          }
        }
        if (matched) continue;
        var singleReading = '';
        if (_rubyWordDict && _rubyWordDict[ch]) {
          singleReading = _rubyWordDict[ch][0];
        } else if (_rubyCharDict && _rubyCharDict[ch]) {
          singleReading = _rubyCharDict[ch];
        }
        tokens.push({ char: ch, reading: singleReading, needsRuby: true });
        i++;
      }
      return tokens;
    }

    function rubyInjectStyles(doc) {
      if (doc.getElementById(RUBY_STYLE_ID)) return;
      var style = doc.createElement('style');
      style.id = RUBY_STYLE_ID;
      style.textContent = [
        '.readany-ruby rt { font-size: 0.5em; line-height: 1; color: var(--readany-ruby-color, #888); font-weight: normal; user-select: none; -webkit-user-select: none; }',
        '.readany-ruby { ruby-align: center; }',
        '.readany-ruby-container { ruby-position: over; -webkit-ruby-position: before; }'
      ].join('\n');
      if (doc.head) doc.head.appendChild(style);
    }

    function rubyShouldSkip(el) {
      if (el.closest && el.closest('.readany-translation')) return true;
      if (el.closest && el.closest('ruby')) return true;
      if (el.closest && el.closest('rt')) return true;
      if (el.closest && el.closest('[' + RUBY_PROCESSED_ATTR + ']')) return true;
      var tag = el.tagName && el.tagName.toLowerCase();
      if (tag === 'script' || tag === 'style') return true;
      return false;
    }

    function rubyExtractOriginalText(el) {
      var result = '';
      for (var ci = 0; ci < el.childNodes.length; ci++) {
        var child = el.childNodes[ci];
        if (child.nodeType === 3) { result += child.nodeValue || ''; }
        else if (child.nodeType === 1) {
          var tag = child.tagName && child.tagName.toLowerCase();
          if (tag === 'rt' || tag === 'rp') continue;
          result += rubyExtractOriginalText(child);
        }
      }
      return result;
    }

    function doInjectRubyAnnotations(doc, mode) {
      if (!mode || !doc) return 0;
      if (!_rubyWordDict && !_rubyCharDict) return 0;
      rubyInjectStyles(doc);
      var blocks = doc.querySelectorAll('p, h1, h2, h3, h4, h5, h6, li, blockquote, dd, dt, figcaption, div');
      var count = 0;
      for (var bi = 0; bi < blocks.length; bi++) {
        var block = blocks[bi];
        if (!block.textContent || !block.textContent.trim()) continue;
        if (rubyShouldSkip(block)) continue;
        if (block.querySelector && block.querySelector('[' + RUBY_PROCESSED_ATTR + ']')) continue;
        if (!CJK_RE.test(block.textContent)) continue;

        var walker = doc.createTreeWalker(block, NodeFilter.SHOW_TEXT, {
          acceptNode: function(node) {
            if (!node.nodeValue || !node.nodeValue.trim()) return NodeFilter.FILTER_SKIP;
            if (!CJK_RE.test(node.nodeValue)) return NodeFilter.FILTER_SKIP;
            var parent = node.parentElement;
            if (!parent) return NodeFilter.FILTER_ACCEPT;
            if (rubyShouldSkip(parent)) return NodeFilter.FILTER_REJECT;
            return NodeFilter.FILTER_ACCEPT;
          }
        });
        var textNodes = [];
        var tn = walker.nextNode();
        while (tn) { textNodes.push(tn); tn = walker.nextNode(); }

        for (var ti = 0; ti < textNodes.length; ti++) {
          var node = textNodes[ti];
          var text = node.nodeValue || '';
          if (!text.trim() || !CJK_RE.test(text)) continue;
          var tokens = rubyAnnotateChinese(text);
          var span = doc.createElement('span');
          span.setAttribute(RUBY_PROCESSED_ATTR, 'true');
          span.className = 'readany-ruby-container';
          for (var tki = 0; tki < tokens.length; tki++) {
            var token = tokens[tki];
            if (token.needsRuby && token.reading) {
              var ruby = doc.createElement('ruby');
              ruby.className = 'readany-ruby';
              ruby.textContent = token.char;
              var rt = doc.createElement('rt');
              rt.textContent = token.reading;
              ruby.appendChild(rt);
              span.appendChild(ruby);
            } else {
              span.appendChild(doc.createTextNode(token.char));
            }
          }
          if (node.parentNode) node.parentNode.replaceChild(span, node);
          count++;
        }
      }
      return count;
    }

    function doRemoveRubyAnnotations(doc) {
      if (!doc) return;
      var style = doc.getElementById(RUBY_STYLE_ID);
      if (style) style.remove();
      var processed = doc.querySelectorAll('[' + RUBY_PROCESSED_ATTR + ']');
      for (var i = 0; i < processed.length; i++) {
        var el = processed[i];
        var originalText = rubyExtractOriginalText(el);
        var textNode = doc.createTextNode(originalText);
        if (el.parentNode) el.parentNode.replaceChild(textNode, el);
      }
    }

    // Called from RN to set dict data
    window.setRubyDicts = function(wordDictJson, charDictJson) {
      try {
        _rubyWordDict = wordDictJson ? (typeof wordDictJson === 'string' ? JSON.parse(wordDictJson) : wordDictJson) : null;
        _rubyCharDict = charDictJson ? (typeof charDictJson === 'string' ? JSON.parse(charDictJson) : charDictJson) : null;
        return true;
      } catch(e) {
        console.error('[Ruby] Failed to parse dicts:', e);
        return false;
      }
    };

    // Called from RN to inject ruby on current page
    window.injectRuby = function(mode) {
      _rubyMode = mode || null;
      if (!_rubyMode) { window.removeRuby(); return; }
      var doc = null;
      if (view && view.renderer && view.renderer.getContents) {
        var contents = view.renderer.getContents();
        if (contents && contents.length && contents[0] && contents[0].doc) doc = contents[0].doc;
      }
      if (!doc) {
        var iframes = document.querySelectorAll('iframe');
        for (var fi = 0; fi < iframes.length; fi++) {
          try {
            var iframeDoc = iframes[fi].contentDocument || (iframes[fi].contentWindow && iframes[fi].contentWindow.document);
            if (iframeDoc && iframeDoc.body) { doc = iframeDoc; break; }
          } catch(e) {}
        }
      }
      if (doc) doInjectRubyAnnotations(doc, _rubyMode);
    };

    // Called from RN to remove ruby
    window.removeRuby = function() {
      _rubyMode = null;
      var doc = null;
      if (view && view.renderer && view.renderer.getContents) {
        var contents = view.renderer.getContents();
        if (contents && contents.length && contents[0] && contents[0].doc) doc = contents[0].doc;
      }
      if (!doc) {
        var iframes = document.querySelectorAll('iframe');
        for (var fi = 0; fi < iframes.length; fi++) {
          try {
            var iframeDoc = iframes[fi].contentDocument || (iframes[fi].contentWindow && iframes[fi].contentWindow.document);

    function createSceneInsert(doc, anchor, state) {

      el.className = SCENE_INSERT_CLASS;

    // Поиск по значению атрибута вручную: CFI содержит спецсимволы селекторов

        if (parentTag === 'ul' || parentTag === 'ol' || parentTag === 'dl') return parent;

    function findLastVisibleSceneBlock(doc, win) {

      var pSize = renderer.size;
      var pStart = renderer.start;

      var best = null;
      for (var i = 0; i < blocks.length; i++) {
        var block = blocks[i];
        if (!block.textContent || !block.textContent.trim()) continue;
        if (block.closest && block.closest('.' + SCENE_INSERT_CLASS)) continue;
        var rect = block.getBoundingClientRect();
        var visible;
        if (isPaginated && pSize > 0) {
          var visibleLeft = pStart - pSize;
          var visibleRight = pStart;
          visible = rect.right > visibleLeft && rect.left < visibleRight && rect.width > 0;
        } else {
          visible = rect.width > 0 && rect.height > 0 &&
            rect.right > 0 && rect.left < win.innerWidth &&
            rect.bottom > 0 && rect.top < win.innerHeight;
        }
        if (visible) best = block;
      }
      return best;

    // CFI блока — та же схема, что view.getCFI, но с фильтром вставок:
    // якорь ссылается на начало текста блока и переживает нашу разметку.

        if (textNode) {

          range.setEnd(textNode, 0);
        } else {

          range.collapse(true);

          || window.CFI.fake.fromIndex(index);

          host.parentNode.insertBefore(el, host.nextSibling);

        // при подгруженной соседней секции это ПРЕДЫДУЩАЯ глава, в ней нет
        // видимых блоков, и вставка молча не происходила.
        var content = getPrimaryRendererContent();
        if (!content || !content.doc) {
          sceneSlotLog('insert failed: no primary content');
          return;
        }

        if (!win) {
          sceneSlotLog('insert failed: primary doc has no window');
          return;

          return;

          sceneSlotLog('skip: saved scene exists at anchor ' + anchor);
          return;

        if (!host || !host.parentNode) {
          sceneSlotLog('insert failed: host block detached');
          return;

        console.error('[SceneSlots] insertSceneSlot error:', e);
      }

          : [];

        _sceneRestoreAnchors = [];
      }
      var contents = getRendererContents();
      for (var i = 0; i < contents.length; i++) {
        if (contents[i].doc) applySceneInserts(contents[i].doc, contents[i].index);
      }
    };

    // Локализованные подписи врезок — из RN при готовности WebView
    window.configureSceneSlots = function (labelsJson) {
      try {
        var labels = labelsJson
          ? (typeof labelsJson === 'string' ? JSON.parse(labelsJson) : labelsJson)
          : null;

          if (typeof labels[key] === 'string' && labels[key]) {

    window.replaceSceneSlot = function (anchor, imageDataUri) {
      var el = findSceneInsert(anchor);
      if (!el) return;
      renderSceneInsert(el, 'image', { imageDataUri: imageDataUri });

    window.setSceneSlotState = function (anchor, state) {
      var el = findSceneInsert(anchor);
      if (!el) return;
      var next = state === 'loading' ? 'loading' : state === 'error' ? 'error' : 'idle';
      renderSceneInsert(el, next, null);

      var el = findSceneInsert(anchor);
      if (el && el.parentNode) el.parentNode.removeChild(el);
